/* ---------- pattern chooser ---------- */
function defaultPatLen(t, sec) {
  if (t.type === 'drum') return 16;
  return Math.min(64, Math.max(16, (sec ? sec.bars : 4) * 16));
}

function openPatternChooser(anchor, t) {
  const sec = App.section();
  const cur = sec.pats[t.id] == null ? -1 : sec.pats[t.id];
  const grid = h('div', { class: 'popgrid' });
  for (let i = 0; i < MAX_PATTERNS; i++) {
    const p = t.patterns[i];
    const uses = patternUsage(App.song, t, i);
    grid.append(h('button', {
      class: (patternHasNotes(p) ? 'has' : '') + (i === cur ? ' cur' : ''),
      title: 'Pattern ' + PAT_LETTERS[i] + (patternHasNotes(p) ? ' · ' + p.notes.length + ' notes, ' + p.len / 16 + ' bar' + (p.len > 16 ? 's' : '') : ' · empty') + (uses ? ' · used in ' + uses + ' section' + (uses > 1 ? 's' : '') : ''),
      onclick: () => { closePop(); App.edit(() => { if (!t.patterns[i]) t.patterns[i] = newPattern(defaultPatLen(t, sec)); sec.pats[t.id] = i; }, 'arr rack editor'); },
    }, PAT_LETTERS[i]));
  }
  const newInto = (copy) => {
    const slot = firstFreeSlot(t);
    if (slot < 0) { toast('All 16 pattern slots on this track hold notes. Clear one first.', true); return; }
    closePop();
    App.edit(() => {
      t.patterns[slot] = copy && cur >= 0 && t.patterns[cur] ? clone(t.patterns[cur]) : newPattern(copy && cur >= 0 && t.patterns[cur] ? t.patterns[cur].len : defaultPatLen(t, sec));
      sec.pats[t.id] = slot;
    }, 'arr rack editor');
    toast((copy ? 'Copied to pattern ' : 'New pattern ') + PAT_LETTERS[slot] + ' in ' + sec.name + '.');
  };
  const row = h('div', { class: 'poprow' },
    h('button', { class: 'btn small', onclick: () => newInto(true), disabled: cur < 0, title: 'Make an editable copy for this section only' }, 'Copy to new'),
    h('button', { class: 'btn small', onclick: () => newInto(false) }, 'New empty'),
    h('button', { class: 'btn small', disabled: cur < 0, onclick: () => { closePop(); App.edit(() => { sec.pats[t.id] = -1; }, 'arr rack editor'); } }, 'Silent here'));
  openPop(anchor, [h('div', { class: 'poptitle panel-title' }, t.name + ' · ' + sec.name), grid, row], { color: t.color });
}

/* ---------- arranger ---------- */
function sectionWidth(s) { return Math.max(64, s.bars * 15); }

function renderArranger() {
  const grid = $('#arrGrid');
  grid.textContent = '';
  const song = App.song, secs = song.sections;
  const widths = secs.map(sectionWidth);
  grid.style.gridTemplateColumns = '104px ' + widths.map((w) => w + 'px').join(' ');
  grid.append(h('div', { class: 'arr-corner' }, h('span', { class: 'lbl' }, 'Part')));
  secs.forEach((s, i) => {
    grid.append(h('div', {
      class: 'arr-sec' + (i === App.sel.section ? ' cur' : ''), title: s.name + ' · click to select' + (App.tr && App.tr.playing && App.tr.mode === 'song' ? ' and jump here' : ''),
      role: 'button', tabindex: 0, 'data-sec': i,
      onclick: () => App.selectSection(i, true),
      onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); App.selectSection(i, true); } },
    }, h('b', null, s.name), h('span', null, s.bars + (s.bars === 1 ? ' BAR' : ' BARS'))));
  });
  for (const t of song.tracks) {
    grid.append(h('div', { class: 'arr-tname', vars: { '--tc': t.color }, onclick: () => App.selectTrack(t.id), title: t.name }, h('i'), t.name));
    secs.forEach((s, i) => {
      const pi = s.pats[t.id] == null ? -1 : s.pats[t.id];
      const cell = h('div', {
        class: 'arr-cell' + (i === App.sel.section ? ' cur' : '') + (t.mute ? ' muted' : ''), vars: { '--tc': t.color },
        'data-t': t.id, 'data-s': i, role: 'button', tabindex: -1, title: t.name + ' in ' + s.name + ': ' + (pi < 0 ? 'silent' : 'pattern ' + PAT_LETTERS[pi]),
        onclick: () => {
          App.sel.section = i; App.sel.track = t.id;
          App.render('arr rack editor keys transport');
          const a = $('.arr-cell[data-t="' + t.id + '"][data-s="' + i + '"]');
          if (a) openPatternChooser(a, t);
        },
      });
      if (pi >= 0) cell.append(h('div', { class: 'blk' + (patternHasNotes(t.patterns[pi]) ? '' : ' pat-empty') }, PAT_LETTERS[pi]));
      grid.append(cell);
    });
  }
  grid.append(h('div', { class: 'arr-play', id: 'arrPlay' }));
  App.arrGeom = { widths, left: 104 };
  const sec = App.section();
  const nm = $('#secName');
  if (document.activeElement !== nm) nm.value = sec.name;
  $('#secBars').value = String(sec.bars);
  $('#secDel').disabled = secs.length <= 1;
  $('#secLeft').disabled = App.sel.section === 0;
  $('#secRight').disabled = App.sel.section >= secs.length - 1;
  const bars = secs.reduce((a, s) => a + s.bars, 0);
  $('#songLen').textContent = secs.length + ' parts · ' + bars + ' bars · ' + fmtTime((bars * 4 * 60) / song.bpm);
}

function arrangerPlayhead(cur) {
  const ph = $('#arrPlay');
  if (!ph || !App.arrGeom) return;
  if (!cur || !App.tr.playing) { ph.style.display = 'none'; return; }
  const { widths, left } = App.arrGeom;
  let x = left;
  for (let i = 0; i < cur.sec && i < widths.length; i++) x += widths[i];
  const s = App.song.sections[cur.sec];
  if (!s) return;
  x += (cur.step / sectionSteps(s)) * (widths[cur.sec] || 0);
  ph.style.display = 'block';
  ph.style.transform = 'translateX(' + x + 'px)';
}

function initArrangerControls() {
  const bars = $('#secBars');
  for (const b of SECTION_BARS) bars.append(h('option', { value: String(b) }, String(b)));
  bars.addEventListener('change', () => App.edit(() => { App.section().bars = parseInt(bars.value, 10); }, 'arr transport editor'));
  const nm = $('#secName');
  nm.addEventListener('change', () => { const v = nm.value.trim().slice(0, 24); if (v) App.edit(() => { App.section().name = v; }, 'arr transport'); });
  nm.addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter') nm.blur(); });
  $('#secAdd').addEventListener('click', () => App.edit((song) => {
    const i = App.sel.section + 1;
    song.sections.splice(i, 0, { name: 'Part ' + (song.sections.length + 1), bars: App.section().bars, pats: Object.fromEntries(song.tracks.map((t) => [t.id, -1])) });
    App.sel.section = i;
  }, 'all'));
  $('#secDup').addEventListener('click', () => App.edit((song) => {
    const s = clone(App.section());
    s.name = (s.name + ' 2').slice(0, 24);
    song.sections.splice(App.sel.section + 1, 0, s);
    App.sel.section++;
  }, 'all'));
  const move = (d) => App.edit((song) => {
    const i = App.sel.section, j = i + d;
    if (j < 0 || j >= song.sections.length) return;
    const [s] = song.sections.splice(i, 1);
    song.sections.splice(j, 0, s);
    App.sel.section = j;
  }, 'all');
  $('#secLeft').addEventListener('click', () => move(-1));
  $('#secRight').addEventListener('click', () => move(1));
  $('#secDel').addEventListener('click', () => {
    if (App.song.sections.length <= 1) return;
    const name = App.section().name;
    App.edit((song) => { song.sections.splice(App.sel.section, 1); App.sel.section = Math.min(App.sel.section, song.sections.length - 1); }, 'all');
    toast('Deleted ' + name + '. Press Ctrl+Z to undo.');
  });
  $('#followBtn').addEventListener('click', () => {
    App.ui.follow = !App.ui.follow;
    $('#followBtn').classList.toggle('on', App.ui.follow);
  });
  $('#addTrack').addEventListener('click', (e) => addTrackMenu(e.currentTarget));
}

Object.assign(App.renderers, { rack: renderRack, arranger: renderArranger });
Object.assign(ND, { applyPreset, applyKit, previewTrack, openPatternChooser, arrangerPlayhead, initArrangerControls, defaultPatLen });

/* ---- 09-ui-grid.js ---- */
/* Nightdrive 84 — pattern editor: piano roll, drum grid, velocity lane (canvas) */

const ROLL_LO = 24, ROLL_HI = 96;
const DRAW_LENS = [[1, '1/16'], [2, '1/8'], [4, '1/4'], [8, '1/2'], [16, '1 bar']];

const Grid = {
  memo: {},
  drag: null,
  hoverRow: -1,

  mount(area, lane, t, pat) {
    this.area = area; this.laneEl = lane; this.track = t; this.pat = pat;
    this.kind = t.type === 'drum' ? 'drum' : 'roll';
    this.canvas = h('canvas', { class: 'gc', 'aria-hidden': 'true' });
    this.scroll = h('div', { class: 'gscroll', tabindex: 0, 'aria-label': this.kind === 'drum' ? 'Drum step grid' : 'Piano roll' });
    this.spacer = h('div', { class: 'gspacer' });
    this.scroll.append(this.spacer);
    this.playhead = h('div', { class: 'gplay' });
    Object.assign(this.playhead.style, { position: 'absolute', top: '0', bottom: '0', left: '0', width: '2px', background: 'var(--k-yellow)', boxShadow: '0 0 8px var(--k-yellow)', pointerEvents: 'none', zIndex: '1', display: 'none' });
    area.append(this.canvas, this.scroll, this.playhead);
    this.g = this.canvas.getContext('2d');
    if (lane) {
      this.laneCanvas = h('canvas', { 'aria-hidden': 'true' });
      lane.append(this.laneCanvas);
      this.lg = this.laneCanvas.getContext('2d');
      lane.onpointerdown = (e) => this.laneDown(e);
    } else { this.laneCanvas = null; this.lg = null; }
    this.C = {
      bg: '#0d0b18', rowW: '#17142b', rowB: '#120f22', rowOut: '#0b0a15', key: '#d9d4ee', keyB: '#221e3a', keyTxt: '#6d6892',
      step: 'rgba(255,255,255,0.045)', beat: 'rgba(255,255,255,0.1)', bar: 'rgba(255,210,58,0.32)', cline: 'rgba(255,255,255,0.13)',
      k: [cssVar('--k-red') || '#ff4b2b', cssVar('--k-orange') || '#ff8f1f', cssVar('--k-yellow') || '#ffd23a', cssVar('--k-cream') || '#efe6cf'],
      fg: '#ece8ff', muted: '#9790c2', dim: '#625c8e', off: 'rgba(255,255,255,0.3)',
    };
    this.scroll.addEventListener('scroll', () => { this.draw(); this.drawLane(); });
    this.scroll.addEventListener('pointerdown', (e) => this.down(e));
    this.scroll.addEventListener('pointermove', (e) => this.move(e));
    this.scroll.addEventListener('pointerup', (e) => this.up(e));
    this.scroll.addEventListener('pointercancel', (e) => this.up(e));
    this.scroll.addEventListener('pointerleave', () => { if (!this.drag) { this.hoverRow = -1; this.draw(); } });
    this.scroll.addEventListener('contextmenu', (e) => e.preventDefault());
    if (this.ro) this.ro.disconnect();
    this.ro = new ResizeObserver(() => { this.layout(); this.draw(); this.drawLane(); });
    this.ro.observe(area);
    this.layout();
    this.restoreScroll();
    this.draw(); this.drawLane();
  },

  layout() {
    const W = Math.max(50, this.area.clientWidth), H = Math.max(50, this.area.clientHeight);
    this.W = W; this.H = H;
    const steps = this.pat ? this.pat.len : 16;
    this.labelW = this.kind === 'drum' ? 104 : 48;
    this.rowH = this.kind === 'drum' ? clamp(Math.floor((H - 12) / 12), 20, 36) : 15;
    const sb = 12;
    const fit = (W - this.labelW - sb) / steps;
    this.cellW = clamp(Math.floor(Math.max(fit, 14) * (App.ui.zoom || 1)), 8, 72);
    const rows = this.kind === 'drum' ? 12 : ROLL_HI - ROLL_LO + 1;
    this.spacer.style.width = this.labelW + steps * this.cellW + 'px';
    this.spacer.style.height = rows * this.rowH + 'px';
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    this.dpr = dpr;
    this.canvas.width = Math.round(W * dpr); this.canvas.height = Math.round(H * dpr);
    this.canvas.style.width = W + 'px'; this.canvas.style.height = H + 'px';
    if (this.laneCanvas) {
      const lw = this.laneEl.clientWidth, lh = this.laneEl.clientHeight;
      this.laneCanvas.width = Math.round(lw * dpr); this.laneCanvas.height = Math.round(lh * dpr);
    }
  },

  restoreScroll() {
    if (this.kind !== 'roll') return;
    const m = this.memo[this.track.id];
    if (m != null) { this.scroll.scrollTop = m; return; }
    let center = 60;
    if (this.pat && this.pat.notes.length) center = this.pat.notes.reduce((a, n) => a + n.n, 0) / this.pat.notes.length;
    else if (this.track.synth && (PRESETS[this.track.preset] || {}).cat === 'Bass') center = 40;
    this.scroll.scrollTop = Math.max(0, (ROLL_HI - center) * this.rowH - this.H / 2);
  },

  /* ---------- drawing ---------- */
  draw() {
    if (!this.g) return;
    const g = this.g, C = this.C, W = this.W, H = this.H;
    g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
    if (this.kind === 'roll') this.drawRoll(); else this.drawDrum();
    if (this.kind === 'roll') this.memo[this.track.id] = this.scroll.scrollTop;
  },

  vlines(steps, top, bottom) {
    const g = this.g, C = this.C, sx = this.scroll.scrollLeft, lw = this.labelW, cw = this.cellW;
    const s0 = Math.max(0, Math.floor(sx / cw)), s1 = Math.min(steps, Math.ceil((sx + this.W - lw) / cw));
    for (let s = s0; s <= s1; s++) {
      const x = Math.round(lw + s * cw - sx);
      if (x < lw) continue;
      g.fillStyle = s % 16 === 0 ? C.bar : s % 4 === 0 ? C.beat : C.step;
      g.fillRect(x, top, 1, bottom - top);
    }
    const endX = lw + steps * cw - sx;
    if (endX < this.W) { g.fillStyle = 'rgba(5,4,12,0.7)'; g.fillRect(Math.max(lw, endX + 1), top, this.W - endX, bottom - top); }
  },

  drawRoll() {
    const g = this.g, C = this.C, W = this.W, H = this.H, rh = this.rowH, lw = this.labelW, cw = this.cellW;
    const sx = this.scroll.scrollLeft, sy = this.scroll.scrollTop;
    const steps = this.pat ? this.pat.len : 16;
    const rows = ROLL_HI - ROLL_LO + 1;
    const r0 = Math.max(0, Math.floor(sy / rh)), r1 = Math.min(rows - 1, Math.ceil((sy + H) / rh));
    const key = App.song.key;
    for (let r = r0; r <= r1; r++) {
      const note = ROLL_HI - r, y = r * rh - sy;
      let fill = isBlack(note) ? C.rowB : C.rowW;
      if (key && !inScale(note, key)) fill = C.rowOut;
      g.fillStyle = fill; g.fillRect(lw, y, W - lw, rh);
      if (note === this.hoverNote) { g.fillStyle = 'rgba(255,255,255,0.035)'; g.fillRect(lw, y, W - lw, rh); }
      if (note % 12 === 0) { g.fillStyle = C.cline; g.fillRect(lw, y + rh - 1, W - lw, 1); }
    }
    this.vlines(steps, 0, H);
    const tc = this.track.color;
    if (this.pat) {
      for (const n of this.pat.notes) {
        const r = ROLL_HI - n.n;
        if (r < r0 - 1 || r > r1 + 1) continue;
        const x = lw + n.s * cw - sx, y = r * rh - sy, w = Math.max(4, n.l * cw - 1);
        if (x + w < lw || x > W) continue;
        g.globalAlpha = 0.45 + 0.55 * n.v;
        g.fillStyle = tc;
        roundRect(g, x + 1, y + 1, w - 1, rh - 2, 3); g.fill();
        g.globalAlpha = 1;
        g.fillStyle = 'rgba(255,255,255,0.55)';
        g.fillRect(x + 1, y + 1, 2, rh - 2);
        if (w > 30 && rh >= 13) {
          g.fillStyle = 'rgba(11,10,20,0.75)';
          g.font = '600 10px ' + (cssVar('--font-ui') || 'sans-serif');
          g.textBaseline = 'middle';
          g.fillText(noteName(n.n), x + 6, y + rh / 2 + 0.5);
        }
      }
    }
    // keyboard column
    g.save();
    g.beginPath(); g.rect(0, 0, lw, H); g.clip();
    g.fillStyle = '#0b0a14'; g.fillRect(0, 0, lw, H);
    for (let r = r0; r <= r1; r++) {
      const note = ROLL_HI - r, y = r * rh - sy;
      if (isBlack(note)) { g.fillStyle = C.keyB; g.fillRect(0, y, lw * 0.62, rh); }
      else { g.fillStyle = note === this.hoverNote ? '#fff' : C.key; g.fillRect(0, y + 0.5, lw - 2, rh - 1); }
      if (note % 12 === 0) {
        g.fillStyle = '#4b456f'; g.font = '600 10px ' + (cssVar('--font-ui') || 'sans-serif'); g.textBaseline = 'middle';
        g.fillText(noteName(note), lw - 22, y + rh / 2 + 0.5);
      }
    }
    g.restore();
    g.fillStyle = 'rgba(255,255,255,0.08)'; g.fillRect(lw - 1, 0, 1, H);
  },

  drawDrum() {
    const g = this.g, C = this.C, W = this.W, H = this.H, rh = this.rowH, lw = this.labelW, cw = this.cellW;
    const sx = this.scroll.scrollLeft, sy = this.scroll.scrollTop;
    const steps = this.pat ? this.pat.len : 16;
    const map = new Map();
    if (this.pat) for (const n of this.pat.notes) map.set(n.s * 16 + n.n, n);
    const s0 = Math.max(0, Math.floor(sx / cw)), s1 = Math.min(steps - 1, Math.ceil((sx + W - lw) / cw));
    const font = cssVar('--font-ui') || 'sans-serif';
    for (let r = 0; r < 12; r++) {
      const y = r * rh - sy;
      if (y > H || y + rh < 0) continue;
      if (r % 2 === 0) { g.fillStyle = 'rgba(255,255,255,0.018)'; g.fillRect(lw, y, W - lw, rh); }
      for (let s = s0; s <= s1; s++) {
        const x = lw + s * cw - sx;
        const grp = Math.floor((s % 16) / 4);
        const col = C.k[grp];
        const n = map.get(s * 16 + r);
        const pad = cw > 16 ? 2 : 1;
        const bx = x + pad, by = y + 3, bw = cw - pad * 2, bh = rh - 6;
        if (!n) {
          g.fillStyle = '#1a1730'; roundRect(g, bx, by, bw, bh, 3); g.fill();
          g.globalAlpha = 0.22; g.strokeStyle = col; g.lineWidth = 1; roundRect(g, bx + 0.5, by + 0.5, bw - 1, bh - 1, 3); g.stroke(); g.globalAlpha = 1;
        } else {
          g.globalAlpha = n.v >= 0.95 ? 1 : n.v >= 0.7 ? 0.82 : 0.5;
          g.fillStyle = col; roundRect(g, bx, by, bw, bh, 3); g.fill();
          g.globalAlpha = 1;
          if (n.v >= 0.95) { g.strokeStyle = '#fff'; g.lineWidth = 1.5; roundRect(g, bx + 1, by + 1, bw - 2, bh - 2, 2.5); g.stroke(); }
          if (bw >= 8) { g.fillStyle = n.v >= 0.7 ? '#2a0f06' : 'rgba(0,0,0,.45)'; g.beginPath(); g.arc(bx + bw / 2, by + Math.min(7, bh / 3), 2, 0, Math.PI * 2); g.fill(); }
        }
      }
    }
    this.vlines(steps, 0, Math.min(H, 12 * rh - sy));
    // labels
    g.fillStyle = '#0b0a14'; g.fillRect(0, 0, lw, H);
    for (let r = 0; r < 12; r++) {
      const y = r * rh - sy;
      const hov = r === this.hoverRow;
      g.fillStyle = hov ? '#2a2548' : '#17142b';
      roundRect(g, 4, y + 3, lw - 10, rh - 6, 4); g.fill();
      g.fillStyle = hov ? C.fg : C.muted;
      g.font = '700 11px ' + font; g.textBaseline = 'middle';
      g.fillText(DRUM_VOICES[r].name.toUpperCase(), 11, y + rh / 2 + 0.5);
    }
  },

  drawLane() {
    if (!this.lg) return;
    const g = this.lg, dpr = this.dpr;
    const W = this.laneEl.clientWidth, H = this.laneEl.clientHeight;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = '#0b0a14'; g.fillRect(0, 0, W, H);
    const lw = this.labelW, cw = this.cellW, sx = this.scroll.scrollLeft;
    g.fillStyle = this.C.dim; g.font = '700 10px ' + (cssVar('--font-ui') || 'sans-serif'); g.textBaseline = 'middle';
    g.fillText('VEL', 10, H / 2);
    g.fillStyle = 'rgba(255,255,255,0.06)';
    for (const f of [0.25, 0.5, 0.75]) g.fillRect(lw, Math.round(4 + (H - 8) * (1 - f)), W - lw, 1);
    if (!this.pat) return;
    g.fillStyle = this.track.color;
    const bw = clamp(cw - 4, 3, 10);
    for (const n of this.pat.notes) {
      const x = lw + n.s * cw - sx + 2;
      if (x < lw - 2 || x > W) continue;
      const bh = Math.max(2, n.v * (H - 8));
      g.globalAlpha = 0.85;
      g.fillRect(x, H - 4 - bh, bw, bh);
      g.globalAlpha = 1;
      g.fillRect(x, H - 4 - bh, bw, 2);
    }
  },

  setPlayhead(step) {
    if (step == null || !this.pat) { this.playhead.style.display = 'none'; return; }
    const ls = step % this.pat.len;
    let x = this.labelW + ls * this.cellW - this.scroll.scrollLeft;
    if (App.ui.follow && App.tr.playing && (x > this.W - 16 || x < this.labelW)) {
      const vis = this.W - this.labelW - 16;
      this.scroll.scrollLeft = clamp(ls * this.cellW - 8, 0, this.pat.len * this.cellW);
      x = this.labelW + ls * this.cellW - this.scroll.scrollLeft;
      if (vis < 0) return;
    }
    if (x < this.labelW || x > this.W) { this.playhead.style.display = 'none'; return; }
    this.playhead.style.display = 'block';
    this.playhead.style.transform = 'translateX(' + Math.round(x) + 'px)';
  },

  /* ---------- hit testing ---------- */
  locate(e) {
    const r = this.scroll.getBoundingClientRect();
    const vx = e.clientX - r.left, vy = e.clientY - r.top;
    const gx = vx - this.labelW + this.scroll.scrollLeft, gy = vy + this.scroll.scrollTop;
    const stepF = gx / this.cellW;
    const row = Math.floor(gy / this.rowH);
    return { vx, vy, gx, stepF, step: Math.floor(stepF), row, label: vx < this.labelW };
  },
  noteAt(p) {
    if (!this.pat) return null;
    const note = ROLL_HI - p.row;
    for (let i = this.pat.notes.length - 1; i >= 0; i--) {
      const n = this.pat.notes[i];
      if (n.n === note && p.stepF >= n.s && p.stepF < n.s + n.l) return n;
    }
    return null;
  },

  down(e) {
    if (e.currentTarget !== this.scroll) return;
    const p = this.locate(e);
    if (this.kind === 'drum') return this.drumDown(e, p);
    if (p.row < 0 || p.row > ROLL_HI - ROLL_LO) return;
    const note = ROLL_HI - p.row;
    if (p.label) { App.audition(this.track, note, 0.8); return; }
    if (!this.pat || p.step < 0 || p.step >= this.pat.len) return;
    e.preventDefault();
    const hit = this.noteAt(p);
    if (e.button === 2) {
      if (hit) { App.edit(() => { this.pat.notes.splice(this.pat.notes.indexOf(hit), 1); }, 'grid arr rack'); }
      return;
    }
    if (e.button !== 0) return;
    History.push(App.song);
    try { this.scroll.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    if (hit) {
      const edgeW = Math.min(9, hit.l * this.cellW * 0.4);
      const endX = (hit.s + hit.l) * this.cellW;
      if (p.gx > endX - edgeW) this.drag = { mode: 'resize', n: hit };
      else this.drag = { mode: 'move', n: hit, off: p.stepF - hit.s, x0: e.clientX, y0: e.clientY, moved: false, lastNote: hit.n };
      App.audition(this.track, hit.n, hit.v, 0.2);
    } else {
      const n = { s: p.step, n: note, l: Math.max(1, Math.min(App.ui.drawLen, this.pat.len - p.step)), v: App.ui.lastVel || 0.8 };
      this.pat.notes.push(n);
      this.drag = { mode: 'draw', n, x0: e.clientX, moved: false };
      App.audition(this.track, note, n.v, 0.2);
    }
    this.draw(); this.drawLane();
  },

  move(e) {
    const p = this.locate(e);
    if (!this.drag) {
      if (this.kind === 'drum') {
        const hr = p.label && p.row >= 0 && p.row < 12 ? p.row : -1;
        this.scroll.style.cursor = p.label ? 'pointer' : 'cell';
        if (hr !== this.hoverRow) { this.hoverRow = hr; this.draw(); }
        return;
      }
      const hn = ROLL_HI - p.row;
      if (hn !== this.hoverNote) { this.hoverNote = hn; this.draw(); }
      if (p.label) { this.scroll.style.cursor = 'pointer'; return; }
      const hit = this.noteAt(p);
      if (hit) {
        const edgeW = Math.min(9, hit.l * this.cellW * 0.4);
        this.scroll.style.cursor = p.gx > (hit.s + hit.l) * this.cellW - edgeW ? 'ew-resize' : 'grab';
      } else this.scroll.style.cursor = 'crosshair';
      return;
    }
    const d = this.drag;
    if (this.kind === 'drum') return this.drumMove(p);
    const len = this.pat.len;
    if (d.mode === 'draw') {
      if (Math.abs(e.clientX - d.x0) > 4) d.moved = true;
      if (d.moved) d.n.l = clamp(Math.floor(p.stepF) - d.n.s + 1, 1, len - d.n.s);
    } else if (d.mode === 'resize') {
      d.n.l = clamp(Math.round(p.stepF - d.n.s), 1, len - d.n.s);
    } else if (d.mode === 'move') {
      if (Math.abs(e.clientX - d.x0) + Math.abs(e.clientY - d.y0) > 4) d.moved = true;
      if (!d.moved) return;
      d.n.s = clamp(Math.round(p.stepF - d.off), 0, len - 1);
      d.n.l = Math.min(d.n.l, len - d.n.s);
      const nn = clamp(ROLL_HI - p.row, ROLL_LO, ROLL_HI);
      if (nn !== d.n.n) { d.n.n = nn; if (nn !== d.lastNote) { d.lastNote = nn; App.audition(this.track, nn, d.n.v, 0.15); } }
      this.scroll.style.cursor = 'grabbing';
    }
    this.draw(); this.drawLane();
  },

  up(e) {
    const d = this.drag;
    if (!d) return;
    this.drag = null;
    try { this.scroll.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    if (this.kind === 'roll') {
      if (d.mode === 'move' && !d.moved) this.pat.notes.splice(this.pat.notes.indexOf(d.n), 1);
      if (d.mode === 'draw' && d.moved) App.ui.drawLenFromDrag = d.n.l;
      if (d.n && this.pat.notes.includes(d.n)) App.ui.lastVel = d.n.v;
    }
    App.changed('grid arr rack');
  },

  drumDown(e, p) {
    if (p.row < 0 || p.row >= 12) return;
    if (p.label) { App.audition(this.track, p.row, 0.85); return; }
    if (!this.pat || p.step < 0 || p.step >= this.pat.len) return;
    e.preventDefault();
    const find = (s, r) => this.pat.notes.find((n) => n.s === s && n.n === r);
    const hit = find(p.step, p.row);
    if (e.button === 2) {
      if (hit) App.edit(() => { hit.v = hit.v < 0.7 ? 0.8 : hit.v < 0.95 ? 1 : 0.5; }, 'grid arr rack');
      return;
    }
    if (e.button !== 0) return;
    History.push(App.song);
    try { this.scroll.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    if (hit) {
      this.pat.notes.splice(this.pat.notes.indexOf(hit), 1);
      this.drag = { mode: 'erase', row: p.row };
    } else {
      const v = e.shiftKey ? 1 : App.ui.paintVel;
      this.pat.notes.push({ s: p.step, n: p.row, v });
      this.drag = { mode: 'paint', row: p.row, v };
      App.audition(this.track, p.row, v);
    }
    this.draw();
  },

  drumMove(p) {
    const d = this.drag;
    if (!this.pat || p.step < 0 || p.step >= this.pat.len || p.row < 0 || p.row >= 12) return;
    const i = this.pat.notes.findIndex((n) => n.s === p.step && n.n === p.row);
    if (d.mode === 'paint' && i < 0) { this.pat.notes.push({ s: p.step, n: p.row, v: d.v }); this.draw(); }
    else if (d.mode === 'erase' && i >= 0) { this.pat.notes.splice(i, 1); this.draw(); }
  },

  laneDown(e) {
    if (!this.pat) return;
    e.preventDefault();
    History.push(App.song);
    const lane = this.laneEl;
    try { lane.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    const apply = (ev) => {
      const r = lane.getBoundingClientRect();
      const step = Math.floor((ev.clientX - r.left - this.labelW + this.scroll.scrollLeft) / this.cellW);
      const v = Math.round(clamp(1 - (ev.clientY - r.top - 4) / (r.height - 8), 0.05, 1) * 100) / 100;
      let any = false;
      for (const n of this.pat.notes) if (n.s === step) { n.v = v; any = true; }
      if (any) { this.draw(); this.drawLane(); }
    };
    apply(e);
    const up = () => { lane.removeEventListener('pointermove', apply); lane.removeEventListener('pointerup', up); lane.removeEventListener('pointercancel', up); App.changed('grid'); };
    lane.addEventListener('pointermove', apply); lane.addEventListener('pointerup', up); lane.addEventListener('pointercancel', up);
  },
};

function roundRect(g, x, y, w, hh, r) {
  r = Math.min(r, w / 2, hh / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + hh, r);
  g.arcTo(x + w, y + hh, x, y + hh, r);
  g.arcTo(x, y + hh, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/* ---------- pattern panel ---------- */
function seg(items, cur, onPick, label) {
  const s = h('div', { class: 'seg', role: 'group', 'aria-label': label });
  for (const [v, txt, title] of items) s.append(h('button', { class: v === cur ? 'on' : '', 'aria-pressed': String(v === cur), title: title || txt, onclick: () => onPick(v) }, txt));
  return s;
}

function renderPatternPanel() {
  const panel = $('#panelPattern');
  panel.textContent = '';
  const t = App.track(), sec = App.section();
  const pi = App.patIndex(t), pat = pi >= 0 ? t.patterns[pi] : null;
  panel.style.setProperty('--tc', t.color);
  const tb = h('div', { class: 'toolbar' });
  const chip = h('button', { class: 'btn small', title: 'Choose which pattern plays in this section', onclick: () => openPatternChooser(chip, t) }, pat ? 'Pattern ' + PAT_LETTERS[pi] : 'No pattern', h('span', { 'aria-hidden': 'true' }, ' ▾'));
  tb.append(chip);
  if (pat) {
    const uses = patternUsage(App.song, t, pi);
    if (uses > 1) tb.append(h('span', { class: 'lbl', title: 'Edits here change every section that uses this pattern' }, 'in ' + uses + ' parts'));
    tb.append(h('span', { class: 'lbl' }, 'Length'));
    tb.append(seg([[16, '1'], [32, '2'], [64, '4'], [128, '8']].map(([v, s]) => [v, s, s + ' bar' + (v > 16 ? 's' : '')]), pat.len, (v) => App.edit(() => setPatternLength(pat, v), 'editor arr'), 'Pattern length in bars'));
    tb.append(h('button', { class: 'btn small', title: 'Double the length by repeating the pattern', disabled: pat.len >= 128, onclick: () => App.edit(() => doublePattern(pat), 'editor arr') }, '×2'));
    if (t.type === 'drum') {
      tb.append(h('span', { class: 'lbl' }, 'Hit'));
      tb.append(seg([[0.5, 'Soft'], [0.8, 'Normal'], [1, 'Accent']], App.ui.paintVel, (v) => { App.ui.paintVel = v; renderPatternPanel(); }, 'Velocity for new hits'));
      tb.append(h('button', { class: 'btn small icon', title: 'Shift pattern one step earlier', 'aria-label': 'Shift left', onclick: () => App.edit(() => shiftPattern(pat, -1), 'grid') }, '◀'));
      tb.append(h('button', { class: 'btn small icon', title: 'Shift pattern one step later', 'aria-label': 'Shift right', onclick: () => App.edit(() => shiftPattern(pat, 1), 'grid') }, '▶'));
    } else {
      tb.append(h('span', { class: 'lbl' }, 'Note'));
      tb.append(seg(DRAW_LENS, App.ui.drawLen, (v) => { App.ui.drawLen = v; renderPatternPanel(); }, 'Length of new notes'));
      tb.append(h('span', { class: 'lbl' }, 'Move'));
      for (const [d, l, ti] of [[-12, '-oct', 'Down an octave'], [-1, '-1', 'Down a semitone'], [1, '+1', 'Up a semitone'], [12, '+oct', 'Up an octave']]) {
        tb.append(h('button', { class: 'btn small', title: ti, onclick: () => App.edit(() => transposePattern(pat, d), 'grid') }, l));
      }
    }
    tb.append(h('span', { class: 'sep' }));
    tb.append(h('button', { class: 'btn small', onclick: () => { App.ui.clip = { kind: t.type, pat: clone(pat) }; toast('Copied pattern ' + PAT_LETTERS[pi] + '.'); renderPatternPanel(); } }, 'Copy'));
    tb.append(h('button', { class: 'btn small', disabled: !(App.ui.clip && App.ui.clip.kind === t.type), onclick: () => App.edit(() => { const c = clone(App.ui.clip.pat); pat.len = c.len; pat.notes = c.notes; }, 'editor arr') }, 'Paste'));
    tb.append(h('button', { class: 'btn small', disabled: !pat.notes.length, onclick: () => App.edit(() => { pat.notes = []; }, 'grid arr rack') }, 'Clear'));
  }
  tb.append(h('span', { class: 'grow' }));
  if (t.type !== 'drum') {
    const keySel = h('select', { class: 'sel', 'aria-label': 'Scale guide root', title: 'Rows outside this key are shaded' });
    NOTE_NAMES.forEach((n, i) => keySel.append(h('option', { value: String(i), selected: App.song.key.root === i }, n)));
    const scSel = h('select', { class: 'sel', 'aria-label': 'Scale guide' });
    for (const k in SCALE_NAMES) scSel.append(h('option', { value: k, selected: App.song.key.scale === k }, SCALE_NAMES[k]));
    keySel.addEventListener('change', () => App.edit(() => { App.song.key.root = parseInt(keySel.value, 10); }, 'grid'));
    scSel.addEventListener('change', () => App.edit(() => { App.song.key.scale = scSel.value; }, 'grid'));
    keySel.style.height = scSel.style.height = '24px';
    tb.append(h('span', { class: 'lbl' }, 'Key'), keySel, scSel);
  }
  tb.append(h('button', { class: 'btn small icon', title: 'Zoom out', 'aria-label': 'Zoom out', onclick: () => { App.ui.zoom = clamp((App.ui.zoom || 1) / 1.35, 0.4, 4); Grid.layout(); Grid.draw(); Grid.drawLane(); } }, '−'));
  tb.append(h('button', { class: 'btn small icon', title: 'Zoom in', 'aria-label': 'Zoom in', onclick: () => { App.ui.zoom = clamp((App.ui.zoom || 1) * 1.35, 0.4, 4); Grid.layout(); Grid.draw(); Grid.drawLane(); } }, '+'));
  panel.append(tb);

  const area = h('div', { class: 'grid-area' });
  panel.append(area);
  let lane = null;
  if (t.type !== 'drum') { lane = h('div', { class: 'lane', title: 'Drag up and down to set note velocity' }); panel.append(lane); }
  panel.append(h('div', { class: 'hint' }, t.type === 'drum'
    ? ['Click a step to add a hit, click it again to remove. Drag to paint. ', h('kbd', null, 'Shift'), '-click adds an accent; right-click cycles soft, normal, accent. Click a drum name to hear it.']
    : ['Click to add a note, drag its right edge to resize, drag the note to move it, click it again to delete. Overlapping notes on a mono sound glide. Drag in the ', h('b', null, 'VEL'), ' lane to set loudness.']));
  if (!pat) {
    area.append(h('div', { class: 'empty-pat' }, h('div', null,
      h('p', null, t.name + ' is silent in ' + sec.name + '. Start a new pattern here, or pick an existing one.'),
      h('div', { class: 'row', style: { justifyContent: 'center' } },
        h('button', { class: 'btn on', onclick: () => {
          const slot = firstFreeSlot(t);
          if (slot < 0) { toast('All 16 pattern slots on this track hold notes.', true); return; }
          App.edit(() => { t.patterns[slot] = newPattern(defaultPatLen(t, sec)); sec.pats[t.id] = slot; }, 'arr rack editor');
        } }, 'New pattern'),
        h('button', { class: 'btn', onclick: (e) => openPatternChooser(e.currentTarget, t) }, 'Choose pattern')))));
  }
  Grid.mount(area, lane, t, pat);
}

App.renderers.grid = () => { Grid.draw(); Grid.drawLane(); };
Object.assign(ND, { Grid, renderPatternPanel });

function liveSynthUpdate(t, key) {
  if (!App.eng) return;
  App.eng.syncTracks(App.song);
  if (key !== 'cut' && key !== 'res' && key !== 'fkey') return;
  const ch = App.eng.channels.get(t.id);
  if (!ch) return;
  const p = t.synth, now = App.ctx.currentTime;
  for (const v of ch.voices) {
    if (v.dead || !v.filters) continue;
    const f = clamp(p.cut * Math.pow(2, ((p.fkey || 0) * ((v.note || 60) - 60)) / 12), 20, 20000);
    v.filters.forEach((bf, i) => {
      bf.frequency.setTargetAtTime(f, now, 0.02);
      if (i === v.filters.length - 1) bf.Q.setTargetAtTime(bf.type === 'bandpass' ? 0.6 + p.res * 12 : -3.01 + p.res * 24, now, 0.02);

  }
}

const masterBuf = new Float32Array(2048);
function updateMeters() {
  if (App.sel.tab !== 'mixer' || !App.eng) return;
  for (const m of Mixer.meters) {
    let pk = 0;
    if (m.id === 'master') {
      App.eng.analyser.getFloatTimeDomainData(masterBuf);
      for (let i = 0; i < masterBuf.length; i++) { const a = Math.abs(masterBuf[i]); if (a > pk) pk = a; }
    } else {
      const ch = App.eng.channels.get(m.id);
      if (ch) pk = ch.meterLevel();
    }
    const db = pk > 0 ? 20 * Math.log10(pk) : -60;
    const hgt = clamp((db + 48) / 51, 0, 1);
    m.lvl = Math.max(hgt, (m.lvl || 0) - 0.035);
    m.el.style.height = (m.lvl * 100).toFixed(1) + '%';
  }
}

/* Nightdrive 84 — playable keys, recording, transport, shortcuts, scope, MIDI */

const CODEMAP = {
  KeyZ: 0, KeyS: 1, KeyX: 2, KeyD: 3, KeyC: 4, KeyV: 5, KeyG: 6, KeyB: 7, KeyH: 8, KeyN: 9, KeyJ: 10, KeyM: 11,
  Comma: 12, KeyL: 13, Period: 14, Semicolon: 15, Slash: 16,
  KeyQ: 12, Digit2: 13, KeyW: 14, Digit3: 15, KeyE: 16, KeyR: 17, Digit5: 18, KeyT: 19, Digit6: 20, KeyY: 21, Digit7: 22, KeyU: 23,
  KeyI: 24, Digit9: 25, KeyO: 26, Digit0: 27, KeyP: 28,
};
const KEY_LABEL = {};
(() => {
  const lower = ['Z', 'S', 'X', 'D', 'C', 'V', 'G', 'B', 'H', 'N', 'J', 'M'];
  const upper = ['Q', '2', 'W', '3', 'E', 'R', '5', 'T', '6', 'Y', '7', 'U', 'I', '9', 'O', '0', 'P'];
  lower.forEach((k, i) => { KEY_LABEL[i] = k; });
  upper.forEach((k, i) => { KEY_LABEL[12 + i] = k; });
})();

const Live = { held: new Map(), recPushed: false };

App.audition = function (t, note, vel, dur) {
  if (!this.ensureAudio()) return;
  const ch = this.eng.channels.get(t.id);
  if (!ch) return;
  const now = this.ctx.currentTime + 0.005;
  if (t.type === 'drum') playDrum(this.eng, ch, t, note, vel || 0.85, now);
  else playSynth(this.eng, ch, t, note, vel || 0.8, now, dur || 0.3);
};

function liveNoteOn(src, note, vel) {
  if (!App.ensureAudio()) return;
  if (Live.held.has(src)) return;
  const t = App.track();
  const ch = App.eng.channels.get(t.id);
  if (!ch) return;
  const now = App.ctx.currentTime;
  let voice = null;
  if (t.type === 'drum') { if (note < 0 || note > 11) return; playDrum(App.eng, ch, t, note, vel, now); }
  else voice = playSynth(App.eng, ch, t, note, vel, now, null);
  const rec = App.ui.rec && App.tr.playing ? recordOn(t, note, vel, now) : null;
  Live.held.set(src, { voice, t, note, start: now, rec });
  markKey(note, true);
}

function liveNoteOff(src) {
  const hd = Live.held.get(src);
  if (!hd) return;
  Live.held.delete(src);
  const now = App.ctx.currentTime;
  if (hd.voice && hd.voice.release) hd.voice.release(now);
  if (hd.rec && hd.t.type !== 'drum') {
    hd.rec.n.l = clamp(Math.round((now - hd.start) / hd.rec.stepDur), 1, hd.rec.pat.len);
    App.changed('grid arr rack');
  }
  markKey(hd.note, false);
}

function allLiveOff() { for (const k of Array.from(Live.held.keys())) liveNoteOff(k); }

function recordOn(t, note, vel, now) {
  const tr = App.tr, cur = tr.cur, song = App.song;
  if (!cur) return null;
  const sec = song.sections[cur.sec];
  if (!sec) return null;
  if (!Live.recPushed) { History.push(song); Live.recPushed = true; }
  let pi = sec.pats[t.id];
  if (pi == null || pi < 0 || !t.patterns[pi]) {
    pi = firstFreeSlot(t);
    if (pi < 0) return null;
    t.patterns[pi] = newPattern(defaultPatLen(t, sec));
    sec.pats[t.id] = pi;
  }
  const pat = t.patterns[pi];
  const stepDur = 60 / song.bpm / 4;
  const ahead = Math.round((now - cur.time) / stepDur);
  let abs = cur.step + ahead;
  if (abs >= sectionSteps(sec)) abs -= sectionSteps(sec);
  const ls = abs % pat.len;
  pat.notes = pat.notes.filter((x) => !(x.s === ls && x.n === note));
  const n = t.type === 'drum' ? { s: ls, n: note, v: Math.round(vel * 100) / 100 } : { s: ls, n: note, l: 1, v: Math.round(vel * 100) / 100 };
  pat.notes.push(n);
  if (ahead >= 1 && tr.sec === cur.sec && tr.step === abs) tr.skip.add(n);
  App.changed('grid arr rack');
  return { pat, n, stepDur };
}

/* ---------- on-screen keyboard and pads ---------- */
function markKey(note, on) {
  const t = App.track();
  const sel = t.type === 'drum' ? '.pad[data-n="' + note + '"]' : '#kb [data-n="' + note + '"]';
  const el = $(sel);
  if (el) el.classList.toggle('down', on);
}

function buildKeyboard() {
  const kb = $('#kb');
  kb.textContent = '';
  const W = kb.clientWidth || 700;
  const nWhite = clamp(Math.floor(W / 30), 8, 29);
  const kw = W / nWhite;
  const base = 12 * (App.ui.oct + 1);
  let wi = 0, note = base;
  while (wi < nWhite) {
    const off = note - base;
    if (!isBlack(note)) {
      kb.append(h('div', { class: 'wk', 'data-n': note, style: { left: wi * kw + 'px', width: kw + 1 + 'px' } },
        h('span', { class: 'klab' }, KEY_LABEL[off] != null ? KEY_LABEL[off] : note % 12 === 0 ? noteName(note) : '')));
      wi++;
    } else {
      const bw = kw * 0.6;
      kb.append(h('div', { class: 'bk', 'data-n': note, style: { left: wi * kw - bw / 2 + 'px', width: bw + 'px' } },
        h('span', { class: 'klab' }, KEY_LABEL[off] != null ? KEY_LABEL[off] : '')));
    }
    note++;
  }
}

function initKeyboardPointer() {
  const kb = $('#kb');
  const active = new Map();
  const keyAt = (x, y) => {
    const el = document.elementFromPoint(x, y);
    const k = el && el.closest && el.closest('#kb [data-n]');
    return k ? parseInt(k.dataset.n, 10) : null;
  };
  const velAt = (y) => {
    const r = kb.getBoundingClientRect();
    return clamp(0.45 + ((y - r.top) / r.height) * 0.6, 0.3, 1);
  };
  kb.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    try { kb.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    const n = keyAt(e.clientX, e.clientY);
    if (n == null) return;
    active.set(e.pointerId, n);
    liveNoteOn('p' + e.pointerId, n, velAt(e.clientY));
  });
  kb.addEventListener('pointermove', (e) => {
    if (!active.has(e.pointerId)) return;
    const n = keyAt(e.clientX, e.clientY);
    if (n == null || n === active.get(e.pointerId)) return;
    liveNoteOff('p' + e.pointerId);
    active.set(e.pointerId, n);
    liveNoteOn('p' + e.pointerId, n, velAt(e.clientY));
  });
  const end = (e) => { if (!active.has(e.pointerId)) return; active.delete(e.pointerId); liveNoteOff('p' + e.pointerId); };
  kb.addEventListener('pointerup', end);
  kb.addEventListener('pointercancel', end);
}

function buildPads() {
  const pads = $('#pads');
  pads.textContent = '';
  DRUM_VOICES.forEach((dv, i) => {
    const b = h('button', { class: 'pad', 'data-n': i, 'aria-label': 'Play ' + dv.name }, dv.name.toUpperCase(), h('span', null, KEY_LABEL[i]));
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } liveNoteOn('pad' + e.pointerId, i, e.shiftKey ? 1 : 0.85); });
    const end = (e) => liveNoteOff('pad' + e.pointerId);
    b.addEventListener('pointerup', end);
    b.addEventListener('pointercancel', end);
    b.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.stopPropagation(); App.audition(App.track(), i, 0.85); } });
    pads.append(b);
  });
}

function renderKeys() {

function initShortcuts() {
  document.addEventListener('keydown', (e) => {
    const tg = e.target;
    const typing = tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT' || tg.isContentEditable);
    if (typing) return;
    if (document.querySelector('.modal-bg')) return;
    if (ND.Viz && ND.Viz.open && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const V = ND.Viz;
      if (e.code === 'Escape') { e.preventDefault(); V.close(); return; }
      if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { e.preventDefault(); V.setScene(V.scene + (e.code === 'ArrowRight' ? 1 : -1)); V.poke(); return; }
      if (e.code === 'KeyF') { e.preventDefault(); V.toggleFull(); return; }
    }
    if (e.ctrlKey || e.metaKey) {
      if (e.code === 'KeyZ') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
      else if (e.code === 'KeyY') { e.preventDefault(); redo(); }
      else if (e.code === 'KeyS') { e.preventDefault(); ND.saveToLibrary(false); }
      return;
    }
    if (e.altKey) return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); return; }
    if (e.code === 'Escape') { stopPlay(true); return; }
    if (e.code === 'Minus') { App.ui.oct = clamp(App.ui.oct - 1, 0, 7); renderKeys(); return; }
    if (e.code === 'Equal') { App.ui.oct = clamp(App.ui.oct + 1, 0, 7); renderKeys(); return; }
    const off = CODEMAP[e.code];
    if (off == null) return;
    e.preventDefault();
    if (e.repeat) return;
    const t = App.track();
    if (t.type === 'drum') { if (off <= 11) liveNoteOn('k' + e.code, off, e.shiftKey ? 1 : 0.85); }
    else liveNoteOn('k' + e.code, 12 * (App.ui.oct + 1) + off, e.shiftKey ? 1 : 0.8);
  });
  document.addEventListener('keyup', (e) => { if (CODEMAP[e.code] != null) liveNoteOff('k' + e.code); });
  window.addEventListener('blur', allLiveOff);
}

const Scope = { buf: new Float32Array(2048), t: 0 };
function drawScope() {
  const c = $('#scope');
  if (!c) return;
  const W = c.clientWidth, H = c.clientHeight;
  if (!W || !H) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if (c.width !== Math.round(W * dpr)) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#12051f'); grd.addColorStop(0.55, '#2a0a33'); grd.addColorStop(0.56, '#07060f'); grd.addColorStop(1, '#07060f');
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  const hz = H * 0.56;
  // sun
  const sun = g.createLinearGradient(0, hz - H * 0.5, 0, hz);
  sun.addColorStop(0, '#ffd23a'); sun.addColorStop(1, '#ff3d9a');
  g.save(); g.beginPath(); g.rect(0, 0, W, hz); g.clip();
  g.globalAlpha = 0.5; g.fillStyle = sun; g.beginPath(); g.arc(W * 0.5, hz, H * 0.42, Math.PI, 0); g.fill();
  g.globalAlpha = 1; g.fillStyle = '#12051f';
  for (let i = 0; i < 4; i++) { const y = hz - 3 - i * 5; g.fillRect(0, y, W, 1.4 + i * 0.4); }
  g.restore();
  // grid floor
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce && App.tr && App.tr.playing) Scope.t = (Scope.t + 0.012 * (App.song.bpm / 120)) % 1;
  g.strokeStyle = 'rgba(255,61,154,0.35)'; g.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const z = (i + Scope.t) / 6;
    const y = hz + (H - hz) * z * z;
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
  }
  for (let i = -8; i <= 8; i++) { g.beginPath(); g.moveTo(W / 2 + i * 6, hz); g.lineTo(W / 2 + i * W * 0.14, H); g.stroke(); }
  // waveform
  if (App.eng) {
    App.eng.analyser.getFloatTimeDomainData(Scope.buf);
    let start = 0;
    for (let i = 1; i < 1024; i++) if (Scope.buf[i - 1] < 0 && Scope.buf[i] >= 0) { start = i; break; }
    const n = 700;
    g.beginPath();
    for (let i = 0; i < n; i++) {
      const v = Scope.buf[start + i] || 0;
      const x = (i / (n - 1)) * W, y = H * 0.45 - v * H * 0.4;
      if (i) g.lineTo(x, y); else g.moveTo(x, y);
    }
    g.strokeStyle = '#7cf7ff'; g.lineWidth = 1.6; g.shadowColor = '#3ce6ff'; g.shadowBlur = 8;
    g.stroke(); g.shadowBlur = 0;
  }
}

/* ---------- storage backends: the artifact's shared store when available, else this browser ---------- */
const LibStore = {
  async list() {
    if (App.lib.db) return App.lib.songs;
    return local.get('nd84.songs', []).map((s) => ({ id: s.id, name: s.name, bpm: s.bpm, updated: s.updated, data: s.data }));
  },
  async put(id, doc) {
    if (App.lib.db) { await App.lib.db.collection('songs').doc(id).set(doc); return; }
    const all = local.get('nd84.songs', []).filter((s) => s.id !== id);
    all.unshift(Object.assign({ id }, doc));
    if (!local.set('nd84.songs', all)) throw new Error('This browser would not store the song (storage is full or blocked). Export it as a file instead.');
  },
  async del(id) {
    if (App.lib.db) { await App.lib.db.collection('songs').doc(id).delete(); return; }
    local.set('nd84.songs', local.get('nd84.songs', []).filter((s) => s.id !== id));
  },
  where() { return App.lib.db ? 'Saved songs live with this app, so they are here on any device you open it from.' : 'Saved songs are kept in this browser on this device.'; },
};

async function saveToLibrary(asCopy) {
  await App.lib.ready;
  const song = App.song;
  const id = (!asCopy && App.lib.libId) || uid('s');
  const data = JSON.stringify(song);
  if (data.length > 250000) { toast('This song is too large to save here. Use Export, then Song file.', true); return false; }
  try {
    await LibStore.put(id, { name: song.name, bpm: song.bpm, updated: Date.now(), data });

}

    m.close();
    if (App.lib.dl) {
      const zip = zipStore([{ name: base + '.wav', data: wav }, { name: safeName(song.name) + '.nightdrive.json', data: new TextEncoder().encode(JSON.stringify(song)) }]);
      await offerFile(base + '.zip', zip);
    } else await offerFile(base + '.wav', new Blob([wav], { type: 'audio/wav' }));
  } catch (e) {
    m.close();
    toast('Export failed: ' + ((e && e.message) || e), true);
  }
}

async function initCapabilities() {
  let done;

  if (!c || typeof c.use !== 'function') { done(); return; }
  try {
    const [dl, db] = await Promise.all([c.use('downloads').catch(() => null), c.use('db').catch(() => null)]);
    if (dl) App.lib.dl = dl;

      db.collection('songs').orderBy('updated', 'desc').limit(200).onSnapshot((snap) => {

/* ---- 13-dsl.js ---- */
/* Nightdrive 84 — the small notation the built-in songs are written in.
   Melodic tokens are 16th-note steps:  C4  = one step,  C4:4 = four steps,  C4+E4+G4:16 = chord,
   .  = rest (.:8 = eight steps),  -  = extend the previous note,  ! accent  ^ strong  ? soft  ~ slide into the next note.
   Drum strings: x hit, X accent, o soft, g ghost, . rest; one character per step. */

const DSL = (() => {
  const VEL = { X: 1, x: 0.8, o: 0.55, g: 0.35 };
  function nextLen(n) {
    for (const L of PAT_LENS) if (n <= L) return L;
    throw new Error('Pattern longer than 8 bars (' + n + ' steps)');
  }

  function mel(src, o) {
    o = o || {};
    const dv = o.vel == null ? 0.8 : o.vel;
    const toks = src.replace(/\|/g, ' ').trim().split(/\s+/).filter(Boolean);
    const notes = [];
    let pos = 0, last = [];
    for (const tk of toks) {
      if (tk === '-') { for (const n of last) n.l += 1; pos += 1; continue; }
      const m = /^([^:!?~^]+)(?::(\d+))?([!?~^]*)$/.exec(tk);
      if (!m) throw new Error('Bad token: ' + tk);
      const body = m[1], len = m[2] ? parseInt(m[2], 10) : 1, fl = m[3] || '';
      if (body === '.') { pos += len; last = []; continue; }
      const v = fl.includes('!') ? 1 : fl.includes('^') ? 0.9 : fl.includes('?') ? 0.55 : dv;
      last = body.split('+').map((nm) => {
        const n = { s: pos, n: parseNote(nm), l: len + (fl.includes('~') ? 1 : 0), v };
        notes.push(n);
        return n;
      });
      pos += len;
    }
    if (o.expect && pos !== o.expect) throw new Error('Phrase is ' + pos + ' steps, expected ' + o.expect + ': ' + src.slice(0, 60));
    return { len: o.len || nextLen(Math.max(16, pos)), notes };
  }

  /* Drum bars: an array of {BD:'x...x...x...x...', SD:'....x.......x...'} objects, 16 steps each. */
  function drums(list) {
    const notes = [];
    list.forEach((bar, bi) => {
      for (const k in bar) {
        const idx = DRUM_INDEX[k];
        if (idx == null) throw new Error('Unknown drum voice ' + k);
        const s = bar[k].replace(/[\s|]/g, '');
        if (s.length !== 16) throw new Error('Drum bar must be 16 steps: ' + k + ' "' + s + '"');
        for (let i = 0; i < 16; i++) { const v = VEL[s[i]]; if (v) notes.push({ s: bi * 16 + i, n: idx, v }); }
      }
    });
    return { len: nextLen(list.length * 16), notes };
  }

  const times = (x, n) => Array(n).fill(x);
  const rep = (s, n) => Array(n).fill(s).join(' ');

  const QUAL = { '': [0, 4, 7], m: [0, 3, 7], '7': [0, 4, 7, 10], m7: [0, 3, 7, 10], maj7: [0, 4, 7, 11], sus4: [0, 5, 7], sus2: [0, 2, 7], add9: [0, 2, 4, 7], madd9: [0, 2, 3, 7], dim: [0, 3, 6], '6': [0, 4, 7, 9], m6: [0, 3, 7, 9], '5': [0, 7] };
  function chordPCs(sym) {
    const m = /^([A-G])([#b]?)(.*)$/.exec(sym);
    if (!m || !(m[3] in QUAL)) throw new Error('Unknown chord ' + sym);
    const root = (parseNote(m[1] + m[2] + '4') % 12);
    return QUAL[m[3]].map((iv) => (root + iv) % 12);
  }

  /* Arpeggiate a progression [[chord, steps], ...] through chord tones stacked up from `low`. */
  function arp(prog, o) {
    o = Object.assign({ low: 'E4', order: [0, 1, 2, 3, 2, 1, 0, 1, 2, 3, 4, 3, 2, 1, 2, 3], rate: 1, len: 1, vel: 0.62, acc: 0.85, accEvery: 4 }, o || {});
    const low = parseNote(o.low);
    const notes = [];
    let pos = 0;
    for (const [sym, steps] of prog) {
      const pcs = chordPCs(sym);
      const tones = [];
      for (let m = low; tones.length < 8; m++) if (pcs.includes(m % 12)) tones.push(m);
      for (let i = 0, k = 0; i < steps; i += o.rate, k++) {
        notes.push({ s: pos + i, n: tones[o.order[k % o.order.length]], l: o.len, v: i % o.accEvery === 0 ? o.acc : o.vel });
      }
      pos += steps;
    }
    return { len: nextLen(pos), notes };
  }

  /* Note name shifted by semitones, e.g. tr('A1', 7) -> 'E2'. */
  function tr(name, semis) {
    const m = parseNote(name) + semis;
    return NOTE_NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
  }

  function transpose(p, semis, velScale) {
    return { len: p.len, notes: p.notes.map((n) => Object.assign({}, n, { n: n.n + semis, v: Math.round(n.v * (velScale || 1) * 100) / 100 })) };
  }

  /* Build a song object from a compact definition. Track ids are stable so saved edits line up. */
  function build(def) {
    const song = {
      v: 1, name: def.name, bpm: def.bpm, swing: def.swing || 0,
      key: def.key, fx: Object.assign({}, FX_DEFAULT, def.fx || {}), tracks: [], sections: [],
    };
    def.tracks.forEach((td, i) => {
      const t = newTrack(td.type || 'synth', { name: td.name, kit: td.kit, preset: td.preset, color: td.color });
      t.id = 't' + (i + 1) + '-' + td.name.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 8);
      for (const k of ['vol', 'pan', 'rev', 'dly', 'cho', 'drv']) if (td[k] != null) t[k] = td[k];
      if (td.synth) Object.assign(t.synth, td.synth);
      if (td.voices) for (const k in td.voices) Object.assign(t.voices[DRUM_INDEX[k]], td.voices[k]);
      for (const L in td.pats || {}) {
        const idx = PAT_LETTERS.indexOf(L);
        if (idx < 0) throw new Error('Bad pattern letter ' + L);
        t.patterns[idx] = td.pats[L];
      }
      song.tracks.push(t);
    });
    for (const [name, bars, map] of def.sections) {
      const pats = {};
      for (const t of song.tracks) {
        const L = map[t.name];
        const idx = L ? PAT_LETTERS.indexOf(L) : -1;
        if (L && !t.patterns[idx]) throw new Error(def.name + ': ' + t.name + ' has no pattern ' + L);
        pats[t.id] = idx;
      }
      for (const k in map) if (!song.tracks.find((t) => t.name === k)) throw new Error(def.name + ': unknown track ' + k + ' in ' + name);
      song.sections.push({ name, bars, pats });
    }
    return song;
  }

  function register(meta, def) {
    DEMOS.push(Object.assign({}, meta, { build: () => build(def()) }));
  }

  return { mel, drums, times, rep, arp, tr, transpose, chordPCs, build, register };
})();

ND.DSL = DSL;

const Viz = (ND.Viz = {
  open: false, scene: 0, auto: true, playlist: false, reduce: false,
  SCENES: [{ key: 'outrun', name: 'Outrun' }, { key: 'keys', name: 'Keys' }, { key: 'tunnel', name: 'Tunnel' }, { key: 'scope', name: 'Scope' }],
  env: { kick: 0, snare: 0, hat: 0, crash: 0, tom: 0, bass: 0, mid: 0, high: 0, level: 0 },
  bands: new Float32Array(48),
  pads: new Float32Array(12),
  lights: [], waves: [], rings: [], streaks: [],
  t: 0, lastPerf: 0, lastSec: -1, lastMeta: '', metaAt: 0, ringClock: 0,

  build() {
    if (this.el) return;
    const mk = (html, title, fn, cls) => {
      const b = h('button', { class: 'vbtn' + (cls ? ' ' + cls : ''), title, 'aria-label': title });
      b.innerHTML = html;
      b.addEventListener('click', (e) => { e.stopPropagation(); fn(); this.poke(); });
      return b;
    };
    this.sceneLab = h('span', { class: 'viz-scene' });
    this.playBtn = mk(VIZ_ICONS.play, 'Play or stop (Space)', () => togglePlay());
    this.autoBtn = mk('AUTO', 'Change scene at each new part of the song', () => { this.auto = !this.auto; this.sync(); }, 'txt');
    this.listBtn = mk('PLAYLIST', 'When a song ends, play the next built-in song', () => this.togglePlaylist(), 'txt');
    this.fullBtn = mk(VIZ_ICONS.full, 'Full screen (F)', () => this.toggleFull());
    const controls = h('div', { class: 'viz-controls' },
      mk(VIZ_ICONS.prev, 'Previous scene (Left arrow)', () => this.setScene(this.scene - 1)), this.sceneLab,
      mk(VIZ_ICONS.fwd, 'Next scene (Right arrow)', () => this.setScene(this.scene + 1)),
      h('span', { class: 'viz-sep' }), this.playBtn, mk(VIZ_ICONS.next, 'Next song', () => this.nextSong()),
      this.autoBtn, this.listBtn, h('span', { class: 'viz-sep' }), this.fullBtn,
