    this.title = h('div', { class: 'viz-title' });
    this.meta = h('div', { class: 'viz-meta' });
    this.card = h('div', { class: 'viz-card', 'aria-live': 'polite' });
    this.hint = h('div', { class: 'viz-hint' }, 'Press Space or ▶ to play');
    this.canvas = h('canvas', { class: 'viz-canvas', 'aria-hidden': 'true' });
    this.el = h('div', { class: 'viz', hidden: true, role: 'dialog', 'aria-label': 'Visualizer', tabindex: -1 },
      this.canvas,
      h('div', { class: 'viz-brand' }, h('span', { class: 'logo-script' }, 'Nightdrive'), h('span', { class: 'logo-num' }, '84')),
      h('div', { class: 'viz-now' }, h('div', { class: 'viz-label' }, 'NOW PLAYING'), this.title, this.meta),
      this.card, this.hint, controls);
    document.body.append(this.el);
    this.g = this.canvas.getContext('2d');
    this.el.addEventListener('pointermove', () => this.poke());
    this.el.addEventListener('pointerdown', () => this.poke());
    this.canvas.addEventListener('dblclick', () => this.toggleFull());
    window.addEventListener('resize', () => { if (this.open) this.resize(); });
    document.addEventListener('fullscreenchange', () => this.sync());
    this.stars = Array.from({ length: 170 }, () => ({ x: Math.random(), y: Math.random(), b: 0.3 + Math.random() * 0.7, s: Math.random() < 0.15 ? 2 : 1, tw: Math.random() * 6.28 }));
    this.ridges = [this.makeRidge(3, 0.14), this.makeRidge(11, 0.085)];
    const sc = document.createElement('canvas');
    sc.width = 1; sc.height = 3;
    const sg = sc.getContext('2d');
    sg.fillStyle = 'rgba(0,0,0,0.2)'; sg.fillRect(0, 2, 1, 1);
    this.scan = this.g.createPattern(sc, 'repeat');
    this.setScene(this.scene);
  },

  show() {
    this.build();
    App.ensureAudio();
    this.open = true;
    this.el.hidden = false;
    document.documentElement.classList.add('viz-open');
    this.resize();
    this.lastSec = -1; this.lastPerf = 0; this.metaAt = 0; this._pl = null;
    this.showCard(App.song.name);
    this.sync(); this.poke();
    this.el.focus({ preventScroll: true });
    if (this.el.requestFullscreen && !document.fullscreenElement) this.el.requestFullscreen().catch(() => {});
  },

  close() {
    if (!this.open) return;
    this.open = false;
    this.playlist = false;
    this.el.hidden = true;
    document.documentElement.classList.remove('viz-open');
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    const b = $('#btnViz');
    if (b) b.focus({ preventScroll: true });
  },

  toggleFull() {
    if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); return; }
    if (!this.el.requestFullscreen) { toast('Full screen is not available here. Use your browser’s full-screen key instead.', true); return; }
    this.el.requestFullscreen().catch(() => toast('Full screen was blocked here. Use your browser’s full-screen key instead.', true));
  },

  sync() {
    if (!this.el) return;
    this.autoBtn.classList.toggle('on', this.auto);
    this.listBtn.classList.toggle('on', this.playlist);
    this.fullBtn.classList.toggle('on', !!document.fullscreenElement);
  },

  poke() {
    if (!this.el) return;
    this.el.classList.remove('idle');
    clearTimeout(this.hideTimer);
    this.hideTimer = setTimeout(() => { if (this.el) this.el.classList.add('idle'); }, 2800);
  },

  setScene(i) {
    const n = this.SCENES.length;
    this.scene = ((i % n) + n) % n;
    if (this.sceneLab) this.sceneLab.textContent = this.SCENES[this.scene].name;
    if (this.el) this.el.dataset.scene = this.SCENES[this.scene].key;
    this.fade = 1;
    this.trail = null;
    this.rings.length = 0;
  },

  togglePlaylist() {
    if (this.playlist) { this.playlist = false; this.sync(); return; }
    guardUnsaved(() => {
      this.playlist = true;
      this.sync();
      setMode('song');
      if (!App.tr.playing) startPlay();
      toast('Playlist is on: the next song starts when this one ends.');
    });
  },

  nextSong() {
    const i = DEMOS.findIndex((d) => d.key === App.lib.demoKey);
    const d = DEMOS[(i + 1) % DEMOS.length];
    guardUnsaved(() => {
      loadSong(d.build(), { demoKey: d.key });
      setMode('song');
      startPlay();
      this.lastSec = -1;
      this.showCard(d.name);
    });
  },

  showCard(text) {
    if (!this.card) return;
    this.card.textContent = text;
    this.card.classList.remove('show');
    void this.card.offsetWidth;
    this.card.classList.add('show');
  },

  resize() {
    const dpr = Math.min(1.5, window.devicePixelRatio || 1);
    const W = Math.max(320, window.innerWidth), H = Math.max(240, window.innerHeight);
    this.W = W; this.H = H; this.dpr = dpr;
    this.canvas.width = Math.round(W * dpr);
    this.canvas.height = Math.round(H * dpr);
    this.trail = null;
    this.keyGeo = null;
  },

  makeRidge(seed, amp) {
    let r = seed * 9973;
    const rand = () => { r = (r * 16807) % 2147483647; return r / 2147483647; };
    const pts = [];
    for (let i = 0; i <= 48; i++) {
      const x = i / 48;
      const valley = 0.15 + 0.85 * Math.min(1, Math.abs(x - 0.5) * 2.4);
      pts.push([x, (0.45 + 0.55 * Math.abs(Math.sin(x * 9.4 + seed))) * (0.6 + 0.4 * rand()) * amp * valley]);
    }
    return pts;
  },

  position() {
    const tr = App.tr, cur = tr.cur;
    if (!tr.playing || !cur) return null;
    const stepDur = 60 / App.song.bpm / 4;
    const lat = App.ctx.outputLatency || App.ctx.baseLatency || 0;
    return { sec: cur.sec, step: cur.step, frac: clamp((App.ctx.currentTime - lat - cur.time) / stepDur, 0, 1) };
  },

  /* Walk k steps from (sec, step) the way the transport will. */
  locate(sec, step, k) {
    const song = App.song;
    if (!song.sections[sec]) return null;
    let s = sec, st = step + k;
    if (App.tr.mode === 'loop' || !App.tr.playing) {
      const L = sectionSteps(song.sections[s]);
      return [s, ((st % L) + L) % L];
    }
    while (st < 0) { if (s === 0) return null; s--; st += sectionSteps(song.sections[s]); }
    while (st >= sectionSteps(song.sections[s])) { st -= sectionSteps(song.sections[s]); s++; if (s >= song.sections.length) return null; }
    return [s, st];
  },

  analyse() {
    const an = App.eng.analyser;
    if (!this.freq) { this.freq = new Uint8Array(an.frequencyBinCount); this.wave = new Float32Array(an.fftSize); }
    an.getByteFrequencyData(this.freq);
    an.getFloatTimeDomainData(this.wave);
    const n = this.freq.length, binHz = App.ctx.sampleRate / 2 / n;
    const avg = (lo, hi) => {
      let a = 0, c = 0;
      for (let i = Math.max(1, Math.floor(lo / binHz)); i <= Math.min(n - 1, Math.ceil(hi / binHz)); i++) { a += this.freq[i]; c++; }
      return c ? a / c / 255 : 0;
    };
    const e = this.env;
    const sm = (old, v, up, down) => (v > old ? old + (v - old) * up : old + (v - old) * down);
    e.bass = sm(e.bass, avg(30, 150), 0.6, 0.12);
    e.mid = sm(e.mid, avg(150, 2000), 0.5, 0.1);
    e.high = sm(e.high, avg(2000, 10000), 0.5, 0.1);
    let rms = 0;
    for (let i = 0; i < this.wave.length; i += 4) rms += this.wave[i] * this.wave[i];
    e.level = sm(e.level, Math.min(1, Math.sqrt(rms / (this.wave.length / 4)) * 3), 0.5, 0.08);
    const B = this.bands.length, f0 = 40, f1 = 12000;
    for (let b = 0; b < B; b++) {
      const lo = f0 * Math.pow(f1 / f0, b / B), hi = f0 * Math.pow(f1 / f0, (b + 1) / B);
      let m = 0;
      for (let i = Math.max(1, Math.floor(lo / binHz)); i <= Math.min(n - 1, Math.ceil(hi / binHz)); i++) if (this.freq[i] > m) m = this.freq[i];
      const v = m / 255;
      this.bands[b] = v > this.bands[b] ? v : this.bands[b] * 0.88 + v * 0.12;
    }
  },

  onHit(x) {
    const e = this.env;
    if (x.d) {
      const n = x.n;
      this.pads[n] = Math.max(this.pads[n], x.v);
      if (n === 0) { e.kick = Math.max(e.kick, x.v); if (this.waves.length < 12) this.waves.push({ r: 0, a: x.v }); }
      else if (n === 1 || n === 2) e.snare = Math.max(e.snare, x.v);
      else if (n === 10) e.crash = 1;
      else if (n >= 5 && n <= 7) e.tom = Math.max(e.tom, x.v);
      else e.hat = Math.max(e.hat, x.v * 0.7);
      if (this.rings.length < 70 && (n <= 2 || (n >= 5 && n <= 7))) this.rings.push({ z: 1, c: DRUM_VIZ[n][1], rot: Math.random() * 6.28, w: x.v, sides: n === 0 ? 8 : n <= 2 ? 4 : 3 });
    } else {
      if (this.lights.length < 240) this.lights.push({ n: x.n, c: x.c, v: x.v, l: x.l, z: 40 });
      if (this.rings.length < 70 && x.l >= 8) this.rings.push({ z: 1, c: x.c, rot: Math.random() * 6.28, w: x.v * 0.5, sides: 5 + (x.ti % 3) });
    }
  },

  frame(hits) {
    if (!this.open) return;
    const nowP = performance.now() / 1000;
    const dt = this.lastPerf ? Math.min(0.1, nowP - this.lastPerf) : 1 / 60;
    this.lastPerf = nowP;
    this.t += dt;
    this.reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    if (App.eng) this.analyse();
    for (const x of hits) this.onHit(x);
    const e = this.env, dk = (r) => Math.exp(-dt * r);
    e.kick *= dk(7); e.snare *= dk(6); e.hat *= dk(14); e.crash *= dk(2.2); e.tom *= dk(5);
    for (let i = 0; i < 12; i++) this.pads[i] *= dk(6);
    const pos = this.position();
    if (!pos) this.lastSec = -1;
    else if (pos.sec !== this.lastSec) {
      if (this.lastSec !== -1 && this.auto) this.setScene(this.scene + 1);
      this.lastSec = pos.sec;
      const s = App.song.sections[pos.sec];
      if (s) this.showCard(s.name);
    }
    const g = this.g, W = this.W, H = this.H;
    g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    g.globalCompositeOperation = 'source-over';
    g.globalAlpha = 1;
    const key = this.SCENES[this.scene].key;
    if (key === 'outrun') this.drawOutrun(g, W, H, dt, pos);
    else if (key === 'keys') this.drawKeys(g, W, H, dt, pos);
    else if (key === 'tunnel') this.drawTunnel(g, W, H, dt);
    else this.drawScope(g, W, H);
    g.globalCompositeOperation = 'source-over';
    g.globalAlpha = 1;
    if (this.fade > 0) { g.fillStyle = 'rgba(0,0,0,' + this.fade.toFixed(3) + ')'; g.fillRect(0, 0, W, H); this.fade = Math.max(0, this.fade - dt * 2.4); }
    if (!this.reduce && e.crash > 0.02) { g.fillStyle = 'rgba(255,255,255,' + (e.crash * 0.09).toFixed(3) + ')'; g.fillRect(0, 0, W, H); }
    g.fillStyle = this.scan; g.fillRect(0, 0, W, H);
    const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.5)');
    g.fillStyle = vg; g.fillRect(0, 0, W, H);
    this.updateHud(pos, nowP);
  },

  updateHud(pos, nowP) {
    const playing = !!App.tr.playing;
    if (playing !== this._pl) { this._pl = playing; this.playBtn.innerHTML = playing ? VIZ_ICONS.stop : VIZ_ICONS.play; this.hint.hidden = playing; }
    if (nowP - this.metaAt < 0.2) return;
    this.metaAt = nowP;
    const song = App.song;
    const si = pos ? pos.sec : App.sel.section;
    const sec = song.sections[si];
    const bar = sectionStartStep(song, si) / 16 + (pos ? Math.floor(pos.step / 16) : 0) + 1;
    const txt = (sec ? sec.name : '') + ' · BAR ' + String(bar).padStart(3, '0') + ' · ' + song.bpm + ' BPM';
    if (this.title.textContent !== song.name) this.title.textContent = song.name;
    if (txt !== this.lastMeta) { this.meta.textContent = txt; this.lastMeta = txt; }
  },

  /* ---------- scene 1: sunset highway ---------- */
  drawOutrun(g, W, H, dt, pos) {
    const e = this.env, hz = Math.round(H * 0.6), cx = W / 2, depth = H - hz;
    const sky = g.createLinearGradient(0, 0, 0, hz);
    sky.addColorStop(0, '#05030d'); sky.addColorStop(0.5, '#1a0734'); sky.addColorStop(1, '#5c1152');
    g.fillStyle = sky; g.fillRect(0, 0, W, hz);
    if (!this.reduce && e.snare > 0.02) { g.fillStyle = 'rgba(255,120,210,' + (e.snare * 0.06).toFixed(3) + ')'; g.fillRect(0, 0, W, hz); }
    for (const s of this.stars) {
      const tw = 0.5 + 0.5 * Math.sin(this.t * 1.7 + s.tw);
      const a = Math.min(1, s.b * (0.2 + 0.45 * tw) + e.hat * 0.55 * s.b);
      g.fillStyle = 'rgba(255,240,255,' + a.toFixed(3) + ')';
      g.fillRect(s.x * W, s.y * hz * 0.8, s.s, s.s);
    }
    const R = Math.min(W, H) * 0.24 * (1 + e.kick * 0.045 + e.bass * 0.05);
    const sy = hz - R * 0.28;
    const glow = g.createRadialGradient(cx, sy, R * 0.5, cx, sy, R * 2.4);
    glow.addColorStop(0, 'rgba(255,70,160,' + (0.32 + e.bass * 0.35).toFixed(3) + ')');
    glow.addColorStop(1, 'rgba(255,70,160,0)');
    g.fillStyle = glow; g.fillRect(0, 0, W, hz);
    g.save();
    g.beginPath(); g.rect(0, 0, W, hz); g.clip();
    for (let i = this.waves.length - 1; i >= 0; i--) {
      const w = this.waves[i];
      w.r += dt * H * (this.reduce ? 0.25 : 0.7);
      w.a *= Math.exp(-dt * 2.6);
      if (w.a < 0.02) { this.waves.splice(i, 1); continue; }
      g.strokeStyle = 'rgba(255,150,220,' + (w.a * 0.45).toFixed(3) + ')';
      g.lineWidth = 2;
      g.beginPath(); g.arc(cx, sy, R + w.r, 0, Math.PI * 2); g.stroke();
    }
    g.beginPath(); g.arc(cx, sy, R, 0, Math.PI * 2); g.clip();
    const sg = g.createLinearGradient(0, sy - R, 0, sy + R);
    sg.addColorStop(0, '#fff6a8'); sg.addColorStop(0.42, '#ffb03a'); sg.addColorStop(0.75, '#ff4f7e'); sg.addColorStop(1, '#ff2a9d');
    g.fillStyle = sg; g.fillRect(cx - R, sy - R, R * 2, R * 2);
    g.fillStyle = sky;
    const ph = this.reduce ? 0 : (this.t * 0.22) % 1;
    for (let i = 0; i < 9; i++) {
      const f = (i + ph) / 9;
      g.fillRect(cx - R, sy + f * R * 1.05 - R * 0.05, R * 2, 1 + f * R * 0.085);
    }
    g.restore();
    this.ridges.forEach((rd, li) => {
      g.beginPath(); g.moveTo(0, hz);
      for (const [x, hh] of rd) g.lineTo(x * W, hz - hh * H);
      g.lineTo(W, hz); g.closePath();
      g.fillStyle = li ? '#12061f' : '#1c0a31'; g.fill();
      g.strokeStyle = li ? 'rgba(60,230,255,0.55)' : 'rgba(255,61,154,0.6)'; g.lineWidth = 1.2; g.stroke();
    });
    const B = this.bands.length, bw = W / B;
    for (let b = 0; b < B; b++) {
      const v = this.bands[b], bh = Math.max(2, v * H * 0.12), x = b * bw;
      g.fillStyle = '#0a0515'; g.fillRect(x + 1, hz - bh, bw - 2, bh);
      g.fillStyle = b % 2 ? 'rgba(255,61,154,0.9)' : 'rgba(60,230,255,0.9)';
      g.fillRect(x + 1, hz - bh, bw - 2, 2);
      if (bh > 14 && bw > 8) {
        g.fillStyle = 'rgba(255,210,58,' + (0.12 + v * 0.5).toFixed(3) + ')';
        for (let y = hz - bh + 6; y < hz - 4; y += 7) { g.fillRect(x + bw * 0.28, y, bw * 0.16, 2); g.fillRect(x + bw * 0.58, y, bw * 0.16, 2); }
      }
    }
    const fl = g.createLinearGradient(0, hz, 0, H);
    fl.addColorStop(0, '#160626'); fl.addColorStop(1, '#030207');
    g.fillStyle = fl; g.fillRect(0, hz, W, depth);
    g.fillStyle = 'rgba(60,230,255,0.35)'; g.fillRect(0, hz - 2, W, 5);
    g.fillStyle = '#9ff4ff'; g.fillRect(0, hz - 1, W, 2);
    const beat = pos ? ((pos.step + pos.frac) / 4) % 1 : this.reduce ? 0 : (this.t * 0.45) % 1;
    const ga = Math.min(1, 0.4 + e.kick * 0.45 + e.bass * 0.25);
    g.save();
    g.beginPath(); g.rect(0, hz + 2, W, depth); g.clip();
    g.beginPath();
    for (let i = 0; i < 18; i++) { const z = 1 + (i + 1 - beat) * 0.8; const y = hz + depth / z; g.moveTo(0, y); g.lineTo(W, y); }
    for (let j = -14; j <= 14; j++) { const X = j * 0.16; g.moveTo(cx + (X * W * 0.5) / 60, hz + depth / 60); g.lineTo(cx + (X * W * 0.5) / 0.8, hz + depth / 0.8); }
    g.strokeStyle = 'rgba(255,61,154,' + (ga * 0.35).toFixed(3) + ')'; g.lineWidth = 4; g.stroke();
    g.strokeStyle = 'rgba(255,110,190,' + ga.toFixed(3) + ')'; g.lineWidth = 1.3; g.stroke();
    g.globalCompositeOperation = 'lighter';
    for (let i = this.lights.length - 1; i >= 0; i--) {
      const L = this.lights[i];
      L.z *= Math.exp(-dt * (this.reduce ? 1.2 : 2.3));
      if (L.z < 0.7) { this.lights.splice(i, 1); continue; }
      const X = clamp((L.n - 64) / 22, -1.4, 1.4);
      const zt = L.z * (1 + 0.06 * Math.min(16, L.l)) + 0.3;
      const wdt = Math.max(1, 7 / L.z) * (0.5 + L.v * 0.6);
      g.strokeStyle = L.c;
      g.beginPath();
      g.moveTo(cx + (X * W * 0.5) / zt, hz + depth / zt);
      g.lineTo(cx + (X * W * 0.5) / L.z, hz + depth / L.z);
      g.globalAlpha = 0.35; g.lineWidth = wdt * 3; g.stroke();
      g.globalAlpha = 0.95; g.lineWidth = wdt; g.stroke();
    }
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.restore();
  },

  /* ---------- scene 2: falling notes onto a keyboard ---------- */
  noteRange() {
    if (this._rangeSong === App.song && this._range) return this._range;
    let lo = 127, hi = 0;
    for (const t of App.song.tracks) {
      if (t.type === 'drum') continue;
      for (const p of t.patterns) if (p) for (const n of p.notes) { const m = n.n + ((t.synth && t.synth.oct) || 0) * 12; if (m < lo) lo = m; if (m > hi) hi = m; }
    }
    if (lo > hi) { lo = 48; hi = 84; }
    lo = Math.max(12, Math.floor(lo / 12) * 12);
    hi = Math.min(120, Math.ceil((hi + 1) / 12) * 12);
    if (hi - lo < 36) hi = lo + 36;
    this._rangeSong = App.song;
    this._range = { lo, hi };
    this.keyGeo = null;
    return this._range;
  },

  keyGeometry(pw) {
    const { lo, hi } = this.noteRange();
    if (this.keyGeo && this.keyGeo.pw === pw) return this.keyGeo;
    let whites = 0;
    for (let m = lo; m <= hi; m++) if (!isBlack(m)) whites++;
    const ww = pw / whites, bw = ww * 0.62;
    const x = {}, w = {}, black = {};
    let wi = 0;
    for (let m = lo; m <= hi; m++) {
      if (!isBlack(m)) { x[m] = wi * ww; w[m] = ww; black[m] = false; wi++; }
      else { x[m] = wi * ww - bw / 2; w[m] = bw; black[m] = true; }
    }
    this.keyGeo = { pw, lo, hi, x, w, black };
    return this.keyGeo;
  },

  drawKeys(g, W, H, dt, pos) {
    const song = App.song;
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#07051a'); bg.addColorStop(1, '#10061f');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    const kbH = Math.max(56, Math.round(H * 0.13)), bottom = H - kbH;
    const hasDrums = song.tracks.some((t) => t.type === 'drum');
    const pw = hasDrums ? Math.round(W * 0.84) : W;
    const geo = this.keyGeometry(pw);
    const AHEAD = 32, pps = bottom / AHEAD;
    const nowSec = pos ? pos.sec : App.sel.section;
    const nowStep = pos ? pos.step + pos.frac : 0;
    const base = Math.floor(nowStep), frac = nowStep - base;
    g.font = '18px ' + (cssVar('--font-lcd') || 'monospace');
    for (let k = 0; k <= AHEAD + 1; k++) {
      const loc = this.locate(nowSec, base, k);
      if (!loc || loc[1] % 4) continue;
      const y = bottom - (k - frac) * pps;
      g.fillStyle = loc[1] % 16 === 0 ? 'rgba(255,210,58,0.2)' : 'rgba(255,255,255,0.05)';
      g.fillRect(0, y, W, loc[1] % 16 === 0 ? 2 : 1);
      if (loc[1] === 0 && k > 0) { g.fillStyle = 'rgba(124,247,212,0.85)'; g.fillText(song.sections[loc[0]].name.toUpperCase(), 14, y - 8); }
    }
    const anySolo = song.tracks.some((t) => t.solo);
    const active = new Map();
    const drumHits = [];
    g.globalCompositeOperation = 'lighter';
    for (let k = -24; k <= AHEAD; k++) {
      const loc = this.locate(nowSec, base, k);
      if (!loc) continue;
      const sec = song.sections[loc[0]];
      for (const t of song.tracks) {
        const pi = sec.pats[t.id];
        if (pi == null || pi < 0 || !t.patterns[pi]) continue;
        const pat = t.patterns[pi], ls = loc[1] % pat.len;
        const muted = t.mute || (anySolo && !t.solo);
        const off0 = k - frac;
        for (const n of pat.notes) {
          if (n.s !== ls) continue;
          if (t.type === 'drum') { if (off0 > -1.5 && !muted) drumHits.push({ off: off0, n: n.n, v: n.v }); continue; }
          const m = n.n + ((t.synth && t.synth.oct) || 0) * 12;
          if (geo.x[m] == null || off0 + n.l < 0) continue;
          if (off0 <= 0 && !muted) active.set(m, t.color);
          const y0 = Math.min(bottom, bottom - off0 * pps), y1 = Math.max(0, bottom - (off0 + n.l) * pps);
          if (y0 <= y1) continue;
          const w = geo.w[m];
          g.globalAlpha = muted ? 0.12 : 0.3 + n.v * 0.55;
          g.fillStyle = t.color;
          roundRect(g, geo.x[m] + 1.5, y1, w - 3, y0 - y1, Math.min(6, w / 3));
          g.fill();
        }
      }
    }
    g.globalAlpha = 1;
    for (const [m, c] of active) {
      const gl = g.createLinearGradient(0, bottom - 60, 0, bottom);
      gl.addColorStop(0, 'rgba(0,0,0,0)'); gl.addColorStop(1, c);
      g.globalAlpha = 0.45; g.fillStyle = gl; g.fillRect(geo.x[m], bottom - 60, geo.w[m], 60);
    }
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = '#05040a'; g.fillRect(0, bottom, pw, kbH);
    g.fillStyle = '#ff3d9a'; g.fillRect(0, bottom - 2, pw, 3);
    for (let m = geo.lo; m <= geo.hi; m++) {
      if (geo.black[m]) continue;
      g.fillStyle = active.get(m) || '#e8e4f6';
      g.fillRect(geo.x[m] + 1, bottom + 2, geo.w[m] - 2, kbH - 4);
      if (m % 12 === 0 && geo.w[m] > 14) { g.fillStyle = '#6d6892'; g.font = '14px ' + (cssVar('--font-lcd') || 'monospace'); g.fillText(noteName(m), geo.x[m] + 3, bottom + kbH - 8); }
    }
    for (let m = geo.lo; m <= geo.hi; m++) {
      if (!geo.black[m]) continue;
      g.fillStyle = active.get(m) || '#17132b';
      g.fillRect(geo.x[m], bottom + 2, geo.w[m], kbH * 0.6);
    }
    if (hasDrums) this.drawDrumLane(g, pw, W, H, bottom, pps, drumHits);
  },

  drawDrumLane(g, x0, W, H, bottom, pps, hits) {
    const cw = (W - x0) / 12;
    g.fillStyle = 'rgba(255,255,255,0.025)'; g.fillRect(x0, 0, W - x0, bottom);
    g.fillStyle = 'rgba(255,255,255,0.1)'; g.fillRect(x0, 0, 1, H);
    g.globalCompositeOperation = 'lighter';
    for (const d of hits) {
      const x = x0 + (d.n + 0.5) * cw, y = bottom - d.off * pps;
      g.globalAlpha = d.off < 0 ? Math.max(0, 1 + d.off / 1.5) : 0.85;
      g.fillStyle = DRUM_VIZ[d.n][1];
      g.beginPath(); g.arc(x, y, Math.max(3, cw * 0.3) * (0.6 + d.v * 0.5), 0, Math.PI * 2); g.fill();
    }
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    const ph = H - bottom;
    g.font = Math.max(11, Math.min(16, cw * 0.45)) + 'px ' + (cssVar('--font-lcd') || 'monospace');
    for (let i = 0; i < 12; i++) {
      const lit = this.pads[i];
      const x = x0 + i * cw;
      g.fillStyle = lit > 0.05 ? DRUM_VIZ[i][1] : '#1a1630';
      g.globalAlpha = lit > 0.05 ? 0.35 + lit * 0.65 : 1;
      g.fillRect(x + 2, bottom + 4, cw - 4, ph - 8);
      g.globalAlpha = 1;
      g.fillStyle = lit > 0.3 ? '#0b0a14' : '#8f89b8';
      g.fillText(DRUM_VIZ[i][0], x + cw / 2 - 8, bottom + ph / 2 + 5);
    }
  },

  /* ---------- scene 3: neon tunnel ---------- */
  drawTunnel(g, W, H, dt) {
    const e = this.env;
    g.fillStyle = this.reduce ? '#04020c' : 'rgba(4,2,12,0.34)';
    g.fillRect(0, 0, W, H);
    const cx = W / 2 + Math.sin(this.t * 0.37) * W * 0.05, cy = H / 2 + Math.cos(this.t * 0.29) * H * 0.05;
    if (App.tr.playing) {
      this.ringClock += dt * (App.song.bpm / 60);
      while (this.ringClock >= 1) { this.ringClock -= 1; this.rings.push({ z: 1, c: '#7a5cff', rot: this.t, w: 0.35, sides: 6 }); }
    }
    const cr = Math.min(W, H) * (0.07 + e.bass * 0.09 + e.kick * 0.05);
    const cg = g.createRadialGradient(cx, cy, 0, cx, cy, cr * 3);
    cg.addColorStop(0, 'rgba(255,150,225,' + (0.45 + e.level * 0.4).toFixed(3) + ')');
    cg.addColorStop(0.3, 'rgba(255,61,154,0.22)');
    cg.addColorStop(1, 'rgba(255,61,154,0)');
    g.globalCompositeOperation = 'lighter';
    g.fillStyle = cg; g.fillRect(cx - cr * 3, cy - cr * 3, cr * 6, cr * 6);
    while (this.streaks.length < 140) this.streaks.push({ a: Math.random() * 6.283, d: 0.02 + Math.random() * 0.06, s: 0.4 + Math.random() });
    const speed = (this.reduce ? 0.3 : 1) * (0.35 + e.level * 2.4 + e.kick * 1.4);
    const Rmax = Math.hypot(W, H) / 2;
    g.lineWidth = 1.5;
    for (let i = this.streaks.length - 1; i >= 0; i--) {
      const s = this.streaks[i];
      const d0 = s.d;
      s.d *= Math.exp(dt * speed * s.s * 1.6);
      if (s.d > 1.2) { this.streaks.splice(i, 1); continue; }
      g.strokeStyle = 'rgba(160,230,255,' + Math.min(0.8, s.d).toFixed(3) + ')';
      g.beginPath();
      g.moveTo(cx + Math.cos(s.a) * d0 * Rmax, cy + Math.sin(s.a) * d0 * Rmax);
      g.lineTo(cx + Math.cos(s.a) * s.d * Rmax, cy + Math.sin(s.a) * s.d * Rmax);
      g.stroke();
    }
    const spin = this.t * 0.25 + e.mid * 0.5;
    const base = Math.min(W, H) * 0.045;
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i];
      r.z *= Math.exp(-dt * (this.reduce ? 0.35 : 0.8 + e.level * 0.8));
      const rad = base / r.z;
      if (rad > Rmax * 1.4) { this.rings.splice(i, 1); continue; }
      const sides = r.sides || 6, a0 = r.rot + spin;
      g.strokeStyle = r.c;
      g.globalAlpha = Math.min(1, (1 - r.z) * 1.4) * (0.5 + r.w * 0.5);
      g.lineWidth = Math.max(1, rad * 0.02 * (0.6 + r.w));
      g.beginPath();
      for (let k = 0; k <= sides; k++) {
        const a = a0 + (k / sides) * Math.PI * 2;
        const x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;
        if (k) g.lineTo(x, y); else g.moveTo(x, y);
      }
      g.stroke();
    }
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
  },

  /* ---------- scene 4: vector scope ---------- */
  drawScope(g, W, H) {
    if (!App.eng) { g.fillStyle = '#020508'; g.fillRect(0, 0, W, H); return; }
    const st = App.eng.stereoAnalysers();
    st.aL.getFloatTimeDomainData(st.bL);
    st.aR.getFloatTimeDomainData(st.bR);
    if (!this.trail) {
      this.trail = document.createElement('canvas');
      this.trail.width = this.canvas.width; this.trail.height = this.canvas.height;
      this.tg = this.trail.getContext('2d');
    }
    const tg = this.tg;
    tg.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    tg.globalCompositeOperation = 'source-over';
    tg.fillStyle = 'rgba(2,5,10,' + (this.reduce ? 0.5 : 0.2) + ')';
    tg.fillRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2, S = Math.min(W, H) * 0.34;
    tg.globalCompositeOperation = 'lighter';
    const B = this.bands.length;
    tg.lineWidth = Math.max(2, S * 0.018);
    for (let b = 0; b < B; b++) {
      const v = this.bands[b], len = S * 0.1 + v * S * 0.5;
      tg.strokeStyle = 'hsla(' + (320 - b * 3.4) + ',100%,62%,' + (0.22 + v * 0.6).toFixed(3) + ')';
      for (const side of [-1, 1]) {
        const a = -Math.PI / 2 + side * ((b + 0.5) / B) * Math.PI, r0 = S * 1.08;
        tg.beginPath();
        tg.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
        tg.lineTo(cx + Math.cos(a) * (r0 + len), cy + Math.sin(a) * (r0 + len));
        tg.stroke();
      }
    }
    tg.strokeStyle = 'rgba(124,247,212,0.22)'; tg.lineWidth = 1;
    tg.beginPath(); tg.arc(cx, cy, S, 0, Math.PI * 2); tg.stroke();
    const k = S * 0.8, rot = this.reduce ? 0 : this.t * 0.15, cr = Math.cos(rot), sr = Math.sin(rot);
    tg.beginPath();
    for (let i = 0; i < 2048; i += 2) {
      const l = st.bL[i], r = st.bR[i];
      const u = (r - l) * 0.7071 * 2.6 * k, w = (l + r) * 0.7071 * k;
      const x = cx + u * cr - w * sr, y = cy - (u * sr + w * cr);
      if (i) tg.lineTo(x, y); else tg.moveTo(x, y);
    }
    tg.strokeStyle = 'rgba(255,61,154,0.22)'; tg.lineWidth = 5; tg.stroke();
    tg.strokeStyle = 'rgba(90,240,255,0.9)'; tg.lineWidth = 1.4; tg.stroke();
    g.fillStyle = '#020508'; g.fillRect(0, 0, W, H);
    g.drawImage(this.trail, 0, 0, W, H);
  },
});

DSL.register({

  composer: 'Nikolai Rimsky-Korsakov', piece: 'Flight of the Bumblebee', year: 1900,
  desc: 'Insert coin: the frantic chromatic buzz on a chip-pulse lead, doubled by square waves, with a marimba bonus stage and a power-lead boss fight.',

  const { mel, drums, times, rep, transpose } = DSL;
  const buzz = mel([
    'E5 D#5 D5 C#5 D5 C#5 C5 B4 C5 B4 A#4 A4 G#4 G4 F#4 F4',
    'E4 D#4 D4 C#4 C4 C#4 D4 D#4 E4 D#4 D4 C#4 C4 C#4 D4 D#4',

    'E4:2 B3:2 G#3:2 B3:2 E4:2 .:2 E3:4',
  ].join(' | '), { expect: 128 });
  const G = ['E', 'Am', 'Am', 'E', 'Dm', 'Dm', 'E', 'E'];
  const ROOT = { E: 'E1', Am: 'A1', Dm: 'D2' };
  const ST = { E: 'E4+G#4+B4', Am: 'E4+A4+C5', Dm: 'F4+A4+D5' };
  const HIT = { E: 'E3+G#3+B3+E4', Am: 'A3+C4+E4+A4', Dm: 'D3+F3+A3+D4' };

  const coin = { CH: 'x.x.x.x.x.x.x.x.' };

  const level = { BD: 'x...x...x...x...', SD: '....x.......x...', CP: '....x.......x...', CH: 'xxxxxxxxxxxxxxxx', OH: '..x...x...x...x.' };
  const levelIn = Object.assign({}, level, { CY: 'X...............' });
  const tomFill = { BD: 'x...x...x.......', SD: '....x...........', HT: '........XX......', MT: '..........XX....', LT: '............XXXX' };
  const bonus = { BD: 'x.........x.....', SD: '........x.......', CH: 'x.x.x.x.x.x.x.x.', CB: '......x.......x.' };

  return {
    name: 'Bumblebee Arcade', bpm: 150, key: { root: 9, scale: 'harmonic' },
    fx: { revSize: 0.45, revLvl: 0.36, dlyDiv: '1/8', dlyFb: 0.25, dlyTone: 0.55, dlyLvl: 0.28, gateLvl: 0.65, comp: 0.5, vol: 0.8 },
    tracks: [
      { name: 'DRUMS', type: 'drum', kit: 'hexagon', color: '#ff5a36', vol: 0.76, rev: 0.05,
        voices: { CP: { lvl: 0.45 }, CH: { lvl: 0.34 }, OH: { lvl: 0.3 }, CY: { lvl: 0.4 }, CB: { lvl: 0.3 } },
        pats: {
          A: drums([coin, Object.assign({}, coin, { SD: '........x.x.xxXX' })]),
          B: drums([Object.assign({}, electro, { CY: 'X...............' })].concat(times(electro, 6), [electroFill])),
          C: drums([levelIn].concat(times(level, 6), [tomFill])),
          D: drums(times(bonus, 7).concat([Object.assign({}, bonus, { SD: '........x.x.xxXX' })])),
          E: drums([{ BD: 'X...............', CY: 'X...............', SD: 'X...............' }, {}]),
        } },
      { name: 'BASS', preset: 'italo', color: '#3ce6ff', vol: 0.7, rev: 0.02,
        pats: {
          A: mel(G.map((c) => rep(`${ROOT[c]}:2 ${up8(ROOT[c])}:2`, 4)).join(' | '), { expect: 128 }),
          B: mel(G.map((c) => ROOT[c] + ':16').join(' | '), { expect: 128 }),
          E: mel('A1:32'),
        } },
      { name: 'BEE', preset: 'chiplead', color: '#ffd23a', vol: 0.56, rev: 0.18, dly: 0.15,
        pats: { A: transpose(buzz, 12) } },
      { name: 'SQUARE', preset: 'squarelead', color: '#ff3d9a', vol: 0.5, rev: 0.2, pan: -0.15,
        pats: { A: buzz } },
      { name: 'MARIMBA', preset: 'marimba', color: '#5dffb4', vol: 0.5, rev: 0.3, dly: 0.2, pan: 0.15,
        pats: { A: buzz } },
      { name: 'POWER', preset: 'powerlead', color: '#ff9a3d', vol: 0.52, rev: 0.22, pan: 0.15,

      { name: 'HITS', preset: 'orchhit', color: '#6fa8ff', vol: 0.44, rev: 0.3,

/* ---- 99-main.js ---- */
/* Nightdrive 84 — boot, frame loop, help */

App.ensureAudio = function () {
  if (!this.ctx) { toast('This browser cannot play Web Audio, so there is no sound here.', true); return false; }
  if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {});
  return true;
};

function openHelp() {
  const k = (t) => h('kbd', null, t);
  const body = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '12px' } },
    h('p', null, 'Nightdrive 84 is a pattern-based groovebox. A song is a row of parts (intro, verse, chorus...). In each part, every track plays one of its sixteen patterns, lettered A to P, or stays silent.'),
    h('div', { class: 'help' },
      h('div', null, h('b', null, 'Arrangement. '), 'Click a part to edit it. Click a cell to choose which pattern that track plays there. A pattern used in several parts changes everywhere at once; use ', h('b', null, 'Copy to new'), ' to make a variation.'),
      h('div', null, h('b', null, 'Loop and Song. '), 'Loop repeats the selected part while you edit. Song plays the arrangement from the selected part to the end.'),
      h('div', null, h('b', null, 'Pattern tab. '), 'Draw notes in the piano roll or hits in the drum grid. Set pattern length, note length, velocity, transpose, copy and paste from the toolbar.'),
      h('div', null, h('b', null, 'Sound tab. '), 'Pick one of ' + Object.keys(PRESETS).length + ' synth presets or 4 drum kits, then shape it: oscillators, filter, envelopes, LFO, FM operators, chorus and drive. Double-click a knob to reset it.'),
      h('div', null, h('b', null, 'Mixer tab. '), 'Faders, pan and sends for every track, plus the hall reverb, ping-pong delay, gated reverb and master glue compressor.'),
      h('div', null, h('b', null, 'Recording. '), 'Arm ', h('b', null, 'Rec'), ', press Play and play the keys: notes land on the nearest 16th in the selected track’s pattern for the playing part.'),
      h('div', null, h('b', null, 'Keys. '), k('Space'), ' play or stop, ', k('Esc'), ' stop, ', k('Z'), '–', k('M'), ' and ', k('Q'), '–', k('P'), ' play notes, ', k('-'), ' ', k('='), ' change octave, ', k('Shift'), ' plays louder.'),
      h('div', null, h('b', null, 'Editing. '), k('Ctrl'), '+', k('Z'), ' undo, ', k('Ctrl'), '+', k('Shift'), '+', k('Z'), ' redo, ', k('Ctrl'), '+', k('S'), ' save. Your work in progress is also kept automatically in this browser.'),
      h('div', null, h('b', null, 'Export. '), 'Render the song or the current part to a WAV file, or save the song file to open later or share.'),
      h('div', null, h('b', null, 'Visualizer. '), 'Full-screen light show for an audience: a sunset highway, falling notes on a keyboard, a neon tunnel and a vector scope, all driven by the notes being played. ', k('←'), ' ', k('→'), ' change scene, ', k('F'), ' full screen, ', k('Esc'), ' close. Playlist plays one song after another.')));
  openModal('How it works', body, { width: 780 });
}

function flashLEDs(ids, now) {
  for (const id of ids) {
    const el = $('.trk .act[data-led="' + id + '"]');
    if (!el) continue;
    el.classList.add('hit');
    el._off = now + 0.09;
  }
}

function frame() {
  requestAnimationFrame(frame);
  if (!App.ctx || !App.tr) return;
  const now = App.ctx.currentTime;
  let hits = [];
  if (App.tr.playing || App.tr.queue.length) {
    const lat = App.ctx.outputLatency || App.ctx.baseLatency || 0;
    const res = App.tr.consume(now - lat);
    const cur = res.cur, fired = res.fired;
    hits = res.hits;
    if (fired.length) flashLEDs(fired, now);
    if (cur) {
      if (App.tr.mode === 'song' && App.ui.follow && cur.sec !== App.sel.section && App.song.sections[cur.sec]) {
        App.sel.section = cur.sec;
        App.render('arr rack editor transport');
      }
      Grid.setPlayhead(cur.sec === App.sel.section ? cur.step : null);
      arrangerPlayhead(cur);
      updateLCD(cur);
    }
  }
  if (App.tr.endTime != null && now > App.tr.endTime + 0.1) {
    stopPlay(false);
    App.selectSection(0);
    if (Viz.open && Viz.playlist) Viz.nextSong();
  }
  for (const el of $$('.trk .act.hit')) if (el._off && now > el._off) el.classList.remove('hit');
  if (Viz.open) { Viz.frame(hits); return; }
  updateMeters();
  drawScope();
}

function boot() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    App.ctx = new AC({ latencyHint: 'interactive' });
  } catch (e) { App.ctx = null; }
  if (App.ctx) {
    App.eng = new Engine(App.ctx);
    App.tr = new Transport(App);
  } else {
    App.tr = { playing: false, queue: [], mode: 'loop', start() {}, stop() {}, consume() { return { cur: null, fired: [] }; } };
  }
  initArrangerControls();
  initTransport();
  initShortcuts();
  $('#btnSongs').addEventListener('click', openLibrary);
  $('#btnSave').addEventListener('click', () => saveToLibrary(false));
  $('#btnExport').addEventListener('click', (e) => exportMenu(e.currentTarget));
  $('#btnHelp').addEventListener('click', openHelp);
  $('#btnViz').addEventListener('click', () => Viz.show());
  const scopeWrap = $('.scope-wrap');
  scopeWrap.setAttribute('role', 'button');
  scopeWrap.setAttribute('tabindex', '0');
  scopeWrap.title = 'Open the full-screen visualizer';
  scopeWrap.addEventListener('click', () => Viz.show());
  scopeWrap.addEventListener('keydown', (e) => { if (e.key === 'Enter') Viz.show(); });
  const lcdSong = $('#lcdSong');
  lcdSong.setAttribute('role', 'button');
  lcdSong.setAttribute('tabindex', '0');
  lcdSong.title = 'Rename the song';
  lcdSong.style.cursor = 'pointer';
  lcdSong.addEventListener('click', () => openSongSettings(lcdSong));
  lcdSong.addEventListener('keydown', (e) => { if (e.key === 'Enter') openSongSettings(lcdSong); });
  const midi = h('button', { class: 'btn small', title: 'Play the selected track from a MIDI keyboard' }, h('span', { class: 'led' }), 'MIDI');
  midi.addEventListener('click', () => enableMIDI(midi));
  $('#recBtn').after(midi);

  const unlock = () => { if (App.ctx && App.ctx.state !== 'running') App.ctx.resume().catch(() => {}); };
  document.addEventListener('pointerdown', unlock, true);
  document.addEventListener('keydown', unlock, true);

  const ui = local.get('nd84.ui', null);
  if (ui && ['pattern', 'sound', 'mixer'].includes(ui.tab)) App.sel.tab = ui.tab;
  let loaded = false;
  const draft = local.get('nd84.draft', null);
  if (draft && draft.song) {
    try {
      loadSong(sanitizeSong(draft.song), { libId: draft.libId, demoKey: draft.demoKey, section: draft.sel || 0 });
      loaded = true;
    } catch (e) { loaded = false; }
  }
  if (!loaded) {
    const d = DEMOS[0];
    loadSong(d.build(), { demoKey: d.key });
    setMode('song');
  }
  /* #song=<key> in the address opens that built-in song (used by the desktop shortcut and the Nightdrive MCP server). */
  const want = /(?:^#|&)song=([\w-]+)/.exec(location.hash || '');
  const wd = want && DEMOS.find((d) => d.key === want[1]);
  if (wd && App.lib.demoKey !== wd.key) {
    const open = () => { loadSong(wd.build(), { demoKey: wd.key }); setMode('song'); toast('Loaded “' + wd.name + '”. Press Play.'); };
    if (loaded && !draft.demoKey) { App.lib.dirty = true; guardUnsaved(open); } else open();
  }
  App.updateUndo();
  initCapabilities();
  requestAnimationFrame(frame);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
